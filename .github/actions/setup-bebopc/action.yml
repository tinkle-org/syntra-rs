name: Install bebopc
description: Install the reviewed Linux x64 compiler used for generated-source checks
runs:
  using: composite
  steps:
    - shell: bash
      run: |
        dir=$(mktemp -d "$RUNNER_TEMP/bebopc.XXXXXX")
        cd "$dir"
        curl -fsSL https://github.com/6over3/bebop/releases/download/v3.2.3/bebopc-linux-x64.zip -o bebopc.zip
        echo '120e7cd301186d3ef3e3296c58cacd6c2995a41ba9cf25339761db0964958b9a  bebopc.zip' | sha256sum --check
        unzip -q bebopc.zip bebopc
        chmod +x bebopc
        echo "$dir" >> "$GITHUB_PATH"
