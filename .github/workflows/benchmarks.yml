name: Benchmarks

on:
  push:
    branches: [main]
    paths:
      - 'crates/**/src/**/*.rs'
      - 'crates/**/benches/**/*.rs'
      - 'schemas/**/*.bop'
      - 'bebop.json'
      - 'crates/syntra-core/tests/bench_allocations.rs'
      - 'scripts/benchmark_baseline.py'
      - 'crates/**/build.rs'
      - 'Cargo.toml'
      - 'Cargo.lock'
      - 'crates/**/Cargo.toml'
      - 'crates/**/Cargo.lock'
      - '.cargo/config'
      - '.cargo/config.toml'
      - 'rust-toolchain.toml'

permissions:
  contents: read

env:
  RUSTUP_TOOLCHAIN: '1.89.0'

jobs:
  benches:
    # A branch-creation push has no previous tip to compare.
    if: ${{ github.event.before && github.event.before != '0000000000000000000000000000000000000000' }}
    runs-on: blacksmith-4vcpu-ubuntu-2404-arm
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          path: new
          persist-credentials: false
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.before }}
          path: old
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # stable
        with:
          toolchain: '1.89.0'
      - name: Prepare identical harnesses and record environment
        run: |
          mkdir results
          src=crates/syntra-core
          # Bootstrap the pre-harness baseline on introduction only. Once present,
          # use each revision's own codec API to measure the same named workloads.
          if [[ ! -e old/scripts/benchmark_baseline.py ]]; then
            cp -R new/$src/benches/{frame_codec.rs,channel.rs,fixtures} old/$src/benches/
            cp new/$src/tests/bench_allocations.rs old/$src/tests/
          fi
          for tree in old new; do
            git -C "$tree" rev-parse HEAD > "results/$tree-revision.txt"
            git -C "$tree" status --short --branch >> "results/$tree-revision.txt"
          done
          { uname -a; lscpu; rustc -Vv; cargo -V; } > results/runner.txt
      - name: Count allocations separately
        run: |
          for tree in old new; do
            (cd "$tree" && cargo test --locked --release -p syntra-core --test bench_allocations -- --ignored --nocapture) | tee "results/$tree-allocations.txt"
          done
        shell: bash
      - name: Compare, repeating any suspected regression
        shell: bash
        env:
          # Don't let checkout-specific symbol tables distinguish otherwise identical executables.
          CARGO_PROFILE_BENCH_STRIP: symbols
        run: |
          if [[ ! -e old/scripts/benchmark_baseline.py ]]; then
            mkdir results/calibration
            python3 new/scripts/benchmark_baseline.py old old results/calibration 2>&1 | tee results/calibration.txt
          fi
          python3 new/scripts/benchmark_baseline.py old new results 2>&1 | tee results/comparison.txt
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: ${{ !cancelled() }}
        with:
          name: benchmark-${{ github.sha }}-${{ github.run_attempt }}
          path: results
          if-no-files-found: error
          retention-days: 14
