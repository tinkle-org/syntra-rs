name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  RUSTUP_TOOLCHAIN: "1.88.0"
  CARGO_TERM_COLOR: always
  CARGO_NET_RETRY: 10

jobs:
  fmt:
    name: rustfmt check
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # stable
        with:
          toolchain: "1.88.0"
          components: rustfmt
      - name: Check formatting
        continue-on-error: true
        run: cargo fmt --all -- --check
        # Migration: inherited `cargo fmt` differences predate this CI.
        # See docs/ci.md §2 for the isolated formatting-only follow-up.
        # New code MUST be rustfmt-clean; do not mix fmt fixes with behavior.

  clippy:
    name: clippy lints
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # stable
        with:
          toolchain: "1.88.0"
          components: clippy
      - uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
          key: cargo-registry-${{ runner.os }}-1.88.0-${{ hashFiles('Cargo.lock') }}
          restore-keys: |
            cargo-registry-${{ runner.os }}-1.88.0-
      - name: Clippy (locked, workspace, all targets)
        # NOTE: baseline has inherited warnings (see docs/ci.md §2).
        # This job reports them without `-D warnings` until the baseline
        # cleanup lands. Never add `--all-features`: production and
        # test-fixture FFI features are mutually distinct and the latter
        # MUST NOT ship. Never add broad `#[allow]`: fix genuine findings.
        run: cargo clippy --locked --workspace --all-targets -- --no-deps
      - name: Clippy strict preview (informational, does not gate)
        continue-on-error: true
        run: cargo clippy --locked --workspace --all-targets -- -D warnings --no-deps

  rust:
    name: locked tests + FFI/WASM contract
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # stable
        with:
          toolchain: "1.88.0"
          targets: wasm32-unknown-unknown
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.14"
      - uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
          key: cargo-registry-${{ runner.os }}-1.88.0-${{ hashFiles('Cargo.lock') }}
          restore-keys: |
            cargo-registry-${{ runner.os }}-1.88.0-
      - name: Locked workspace tests (default features)
        run: cargo test --locked --workspace
      - name: Isolated SC1 WSS-only defaults (no development feature unification)
        run: cargo test --locked -p syntra-sc1-transport --no-default-features
      - name: Explicit SC1 development-carrier regressions
        run: cargo test --locked -p syntra-sc1-transport --features development-carriers
      - name: Default FFI exposes no ABI (explicit, no --all-features)
        run: cargo test --locked -p syntra-ffi --no-default-features
      - name: Production FFI tests
        run: cargo test --locked -p syntra-ffi --no-default-features --features production
      - name: Test-fixture FFI tests
        run: cargo test --locked -p syntra-ffi --no-default-features --features test-fixture
      - name: WASM compile check (non-FFI crates)
        run: cargo check --locked -p syntra-core -p syntra-runtime -p syntra-ws -p syntra-web --target wasm32-unknown-unknown
      - name: FFI exports, C smoke tests and expected WASM rejection
        run: python3 crates/syntra-ffi/tests/build_contract.py

  generated-rust:
    name: generation drift + upstream pin
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.14"
      - uses: bufbuild/buf-setup-action@a47c93e0b1648d5651a065437926377d060baa99 # v1.50.0
        with:
          version: "1.59.0"
          github_token: ${{ github.token }}
      - name: Pinned Rust generation drift check
        run: python3 scripts/check-generated.py
      - name: Upstream snapshot pin check
        run: python3 scripts/check-upstream-pin.py

  package:
    name: package + rustdoc validation
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # stable
        with:
          toolchain: "1.88.0"
      - name: Cargo package contents (non-publishing)
        # `cargo publish --dry-run` is unsuitable while 1.0.0-rc.1 is already
        # published: it would compare against the registry. Use the equivalent
        # non-publishing packaging check per crate, preserving generated sources.
        run: |
          for p in syntra-core syntra-runtime syntra-ws syntra-web syntra-ffi; do
            echo "--- $p ---"
            cargo package --locked -p "$p" --list
            cargo package --locked -p "$p" --no-verify
          done
      - name: Rustdoc (no deps, warnings informational)
        run: cargo doc --locked --workspace --no-deps
      - name: Public API surface check (no accidental changes)
        run: |
          cargo doc --locked -p syntra-core --no-deps
          git diff --exit-code -- crates/syntra-core/src/generated || (echo "generated drift; run buf generate" >&2; exit 1)

  security:
    name: dependency security (deny + audit)
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # stable
        with:
          toolchain: "1.88.0"
      - name: Install pinned security tools
        run: |
          cargo install --locked cargo-deny --version 0.20.2
          cargo install --locked cargo-audit --version 0.22.2
      - name: cargo-deny (licenses, advisories, sources)
        run: cargo deny --locked check advisories licenses sources
      - name: cargo-audit (RustSec)
        run: cargo audit --deny warnings

  dependency-review:
    name: dependency review
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
      pull-requests: write
    outputs:
      has_manifests: ${{ steps.base.outputs.has_manifests }}
    # Tolerate failures when the base dependency graph is unavailable: either
    # the base ref has no manifests (e.g. PR #1 introduces the first
    # Cargo.lock while main has only README) or the dependency graph itself
    # is disabled/unsupported for the repository (the review action then
    # fails with "not supported on this repository" even though manifests
    # exist). Once the graph exists and is readable, high-severity or
    # denied-license findings fail. cargo-deny + cargo-audit in the security
    # job remain blocking regardless.
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - name: Check base manifests
        id: base
        env:
          GH_TOKEN: ${{ github.token }}
          BASE_REF: ${{ github.base_ref }}
          TARGET_REPO: ${{ github.repository }}
        run: |
          if gh api --method GET "repos/${TARGET_REPO}/contents/Cargo.lock" -f ref="$BASE_REF" >/dev/null 2>/tmp/gh_err.txt; then
            echo "has_manifests=true" >> "$GITHUB_OUTPUT"
          elif grep -q "HTTP 404" /tmp/gh_err.txt; then
            echo "has_manifests=false" >> "$GITHUB_OUTPUT"
          else
            cat /tmp/gh_err.txt >&2
            exit 1
          fi
      - name: Check dependency graph availability
        id: graph
        env:
          GH_TOKEN: ${{ github.token }}
          TARGET_REPO: ${{ github.repository }}
        run: |
          if gh api "repos/${TARGET_REPO}/dependency-graph/sbom" >/dev/null 2>/tmp/graph_err.txt; then
            echo "available=true" >> "$GITHUB_OUTPUT"
          elif grep -Eq "HTTP 404|Not Found" /tmp/graph_err.txt; then
            echo "available=false" >> "$GITHUB_OUTPUT"
          else
            cat /tmp/graph_err.txt >&2
            exit 1
          fi
      - name: Dependency review
        id: review
        continue-on-error: true
        uses: actions/dependency-review-action@2031cfc080254a8a887f58cffee85186f0e49e48 # v4.9.0
        with:
          fail-on-severity: high
          deny-licenses: GPL-2.0, GPL-3.0, AGPL-3.0, LGPL-2.0, LGPL-2.1, LGPL-3.0
      - name: Enforce review when graph exists
        run: |
          if [ "${{ steps.review.outcome }}" = "failure" ]; then
            if [ "${{ steps.base.outputs.has_manifests }}" = "true" ] && [ "${{ steps.graph.outputs.available }}" = "true" ]; then
              echo "Dependency review failed with graph available; failing workflow."
              exit 1
            else
              echo "Dependency review unavailable (no base graph or graph disabled/unsupported); tolerating as informational. cargo-deny + cargo-audit remain blocking."
            fi
          fi

  actionlint:
    name: actionlint workflows
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - name: actionlint (pinned)
        run: |
          ACTIONLINT_VERSION=v1.7.7
          curl -sSfL "https://github.com/rhysd/actionlint/releases/download/${ACTIONLINT_VERSION}/actionlint_${ACTIONLINT_VERSION#v}_linux_amd64.tar.gz" -o /tmp/actionlint.tar.gz
          tar -xzf /tmp/actionlint.tar.gz -C /tmp actionlint
          /tmp/actionlint -version
          /tmp/actionlint -color

  required:
    name: required CI status
    needs: [clippy, rust, generated-rust, package, security, actionlint, dependency-review]
    if: always()
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - name: Fail closed if any required job failed or was skipped
        run: |
          python3 - <<'EOF'
          import json, os
          results = json.loads(os.environ["NEEDS_JSON"])
          print(results)
          bad = {k: v.get("result") for k, v in results.items()}
          # Check all required jobs except dependency-review (handled separately below).
          for k, r in bad.items():
              if k == "dependency-review":
                  continue
              if r not in ("success", "skipped"):
                  raise SystemExit(f"required jobs did not all succeed: {bad}")
          # rust and generated-rust are hard requirements: skipped is not success.
          # fmt is informational while inherited formatting differences remain
          # (see docs/ci.md §2); do not hard-require it until the follow-up lands.
          for hard in ("rust", "generated-rust"):
              if bad.get(hard) != "success":
                  raise SystemExit(f"hard-required job {hard} was {bad.get(hard)}")
          # Include dependency-review when it was applicable: fail required
          # if the review failed while the base graph existed. Preserve the
          # existing tolerated behavior when review was skipped or the base
          # had no manifests.
          dep = results.get("dependency-review", {})
          dep_result = dep.get("result")
          dep_manifests = (dep.get("outputs") or {}).get("has_manifests")
          if dep_manifests != "false" and dep_result not in ("success", "skipped"):
              raise SystemExit(f"dependency-review was {dep_result} with graph available: {bad}")
          print("required CI status: pass")
          EOF
        env:
          NEEDS_JSON: ${{ toJSON(needs) }}
