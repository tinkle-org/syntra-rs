name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  RUSTUP_TOOLCHAIN: "1.89.0"
  CARGO_TERM_COLOR: always
  CARGO_NET_RETRY: 10

jobs:
  fmt:
    name: rustfmt check
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # stable
        with:
          toolchain: "1.89.0"
          components: rustfmt
      - name: Check formatting
        continue-on-error: true
        run: cargo fmt --all -- --check
        # Formatting is informational; changed Rust code must be rustfmt-clean.

  clippy:
    name: clippy lints
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # stable
        with:
          toolchain: "1.89.0"
          components: clippy
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
          key: cargo-registry-${{ runner.os }}-1.89.0-${{ hashFiles('Cargo.lock') }}
          restore-keys: |
            cargo-registry-${{ runner.os }}-1.89.0-
      - name: Clippy (locked, workspace, all targets)
        # Warnings are reported here; the strict preview is informational.
        # Never add `--all-features`: production and
        # test-fixture FFI features are mutually distinct and the latter
        # MUST NOT ship. Never add broad `#[allow]`: fix genuine findings.
        run: cargo clippy --locked --workspace --all-targets -- --no-deps
      - name: Clippy strict preview (informational, does not gate)
        continue-on-error: true
        run: cargo clippy --locked --workspace --all-targets -- -D warnings --no-deps

  rust:
    name: locked tests + FFI/WASM contract
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # stable
        with:
          toolchain: "1.89.0"
          targets: wasm32-unknown-unknown
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.14"
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
          key: cargo-registry-${{ runner.os }}-1.89.0-${{ hashFiles('Cargo.lock') }}
          restore-keys: |
            cargo-registry-${{ runner.os }}-1.89.0-
      - name: Locked default-members tests (without integration feature unification)
        run: cargo test --locked
      - name: Locked workspace tests (includes integration carrier fixtures)
        run: cargo test --locked --workspace
      - name: Default dependency isolation (host + WASM, no dev/test graph)
        run: python3 scripts/cargo_contracts.py isolation
      - name: WebSocket production graph excludes TLS implementations and HTTP/cross-carrier opt-ins
        run: python3 scripts/cargo_contracts.py websocket
      - name: Managed WebSocket/routes production graph excludes TLS implementations and HTTP/cross-carrier opt-ins
        run: python3 scripts/cargo_contracts.py managed-websocket
      - name: HTTP candidate graphs require candidate core without TLS implementations, state stores or cross-carrier opt-in
        run: python3 scripts/cargo_contracts.py http
      - name: Separate cross-carrier candidate graphs with provider WSS and explicit managed/HTTP compositions
        run: python3 scripts/cargo_contracts.py cross-carrier-candidate
      - name: Core candidate context fixtures with default rejection and explicit opt-in
        run: |
          cargo test --locked -p syntra-core --no-default-features --test http_candidate_context
          cargo test --locked -p syntra-core --no-default-features --features http-candidate --test http_candidate_context
      - name: Install pinned evidence parser for exact execution proof
        run: python3 -m pip install -r scripts/requirements-evidence.txt
      - name: Candidate offline agreement (no uncommitted SDD required)
        id: candidate_agreement
        run: python3 -B scripts/protocol_contract.py --offline --run-rust --output "$RUNNER_TEMP/candidate-rust-agreement"
      - name: Preserve candidate agreement scope and exact command logs
        # Preserve attempted checks, but do not report missing evidence when an
        # earlier failure skipped its producer. Missing attempted output is fatal.
        if: ${{ !cancelled() && (steps.candidate_agreement.outcome == 'success' || steps.candidate_agreement.outcome == 'failure') }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: candidate-rust-agreement
          path: ${{ runner.temp }}/candidate-rust-agreement
          if-no-files-found: error
      - name: Isolated network-free transport defaults
        run: cargo test --locked -p syntra-net
      - name: Explicit TCP carrier regressions
        run: cargo test --locked -p syntra-net --no-default-features --features tcp
      - name: Isolated candidate HTTP/HTTPS protected connections and raw adapter regressions
        run: cargo test --locked -p syntra-net --no-default-features --features http
      - name: Managed HTTP/HTTPS and direct/proxy/forward routes without WebSocket
        run: cargo test --locked -p syntra-net --no-default-features --features managed,http,proxy --test http_connections --test network_http --test routes
      - name: Candidate HTTP/HTTPS and WebSocket feature composition
        run: cargo test --locked -p syntra-net --no-default-features --features managed,http,websocket,proxy --test http_connections --test network_http --test routes
      - name: Exact candidate HTTP forward/proxy regression execution
        run: python3 -B crates/syntra-net/tests/target_contract.py TargetContract.test_http_proxy_regressions_execute_exactly -v
      - name: WebSocket framing/upgrade and application TLS provider regressions
        run: cargo test --locked -p syntra-net --no-default-features --features websocket
      - name: Optional rustls WSS regressions
        run: cargo test --locked -p syntra-net --no-default-features --features tls-rustls --test wss
      - name: Explicit reconnect regressions
        run: cargo test --locked -p syntra-net --no-default-features --features tcp,tls-rustls,reconnect
      - name: Managed runtime and TCP listener regressions
        run: cargo test --locked -p syntra-net --no-default-features --features managed
      - name: Managed WS/provider WSS listeners and routes without production TLS dependencies
        run: cargo test --locked -p syntra-net --no-default-features --features managed,websocket,proxy --test network_websocket --test routes
      - name: Managed WebSocket listeners and routes with optional rustls enabled
        run: cargo test --locked -p syntra-net --no-default-features --features managed,tls-rustls,proxy --test network_websocket --test routes
      - name: Cross-carrier candidate, exact budget/security regressions and owned failover example
        run: >-
          python3 -B crates/syntra-net/tests/target_contract.py
          TargetContract.test_cross_carrier_candidate_regressions_execute
          TargetContract.test_candidate_budget_security_regressions_execute_exactly
          TargetContract.test_candidate_failover_example_executes -v
      - name: Owned-runtime client/server examples
        run: |
          cargo run --locked -p syntra-net --no-default-features --features managed --example managed_tcp
          cargo run --locked -p syntra-net --no-default-features --features managed,websocket --example managed_wss
          cargo run --locked -p syntra-net --no-default-features --features managed,http --example managed_http
          cargo run --locked -p syntra-net --no-default-features --features managed,http --example managed_http -- --https
      - name: SOCKS5 and HTTP CONNECT proxy regressions
        run: cargo test --locked -p syntra-net --no-default-features --features proxy
      - name: Native enrollment regressions (explicit SQLite reference)
        run: cargo test --locked -p syntra-net --no-default-features --features tls-rustls,native-enrollment
      - name: Runtime file-store regressions (not a default filesystem dependency)
        run: cargo test --locked -p syntra-runtime --no-default-features --features file-store
      - name: Default FFI exposes no ABI (explicit, no --all-features)
        run: cargo test --locked -p syntra-ffi --no-default-features
      - name: Production FFI tests
        run: cargo test --locked -p syntra-ffi --no-default-features --features production
      - name: Test-fixture FFI tests
        run: cargo test --locked -p syntra-ffi --no-default-features --features test-fixture
      - name: WASM baseline (core, runtime and record-protection kernel)
        run: cargo check --locked -p syntra-core -p syntra-runtime --target wasm32-unknown-unknown
      - name: Native feature entry points, nonzero regression execution and WASM rejection
        run: python3 crates/syntra-net/tests/target_contract.py
      - name: FFI exports, C smoke tests and expected WASM rejection
        run: python3 crates/syntra-ffi/tests/build_contract.py

  native-macos:
    name: native validation (macOS)
    runs-on: macos-15
    timeout-minutes: 45
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # stable
        with:
          toolchain: "1.89.0"
      - name: Locked default-members tests
        run: cargo test --locked
      - name: Locked workspace tests
        run: cargo test --locked --workspace
      - name: Isolated HTTP carrier tests
        run: cargo test --locked -p syntra-net --no-default-features --features http
      - name: Managed HTTP and proxy routes
        run: cargo test --locked -p syntra-net --no-default-features --features managed,http,proxy --test http_connections --test network_http --test routes
      - name: Managed WebSocket and proxy routes
        run: cargo test --locked -p syntra-net --no-default-features --features managed,websocket,proxy --test network_websocket --test routes
      - name: Explicit native transport and enrollment tests
        run: cargo test --locked -p syntra-net --no-default-features --features managed,proxy,tls-rustls,native-enrollment,http
      - name: Runtime file-store tests
        run: cargo test --locked -p syntra-runtime --no-default-features --features file-store
      - name: Production FFI tests
        run: cargo test --locked -p syntra-ffi --no-default-features --features production
      - name: Test-fixture FFI tests
        run: cargo test --locked -p syntra-ffi --no-default-features --features test-fixture

  generated-rust:
    name: generation drift + upstream pin
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
    env:
      SYNTRA_SDD_ROOT: ${{ github.workspace }}/../syntra-sdd
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # stable
        with:
          toolchain: "1.89.0"
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.14"
      - uses: bufbuild/buf-setup-action@a47c93e0b1648d5651a065437926377d060baa99 # v1.50.0
        with:
          version: "1.59.0"
          github_token: ${{ github.token }}
      - name: Pinned Rust generation drift check
        run: python3 scripts/check-generated.py
      - name: Fetch accepted SDD Git objects (not floating HEAD or local documents)
        run: |
          git init "$SYNTRA_SDD_ROOT"
          git -C "$SYNTRA_SDD_ROOT" remote add origin https://github.com/tinkle-org/syntra.git
          git -C "$SYNTRA_SDD_ROOT" fetch --depth=1 origin 8ede3810b29fbba4d0e6ae6751a0025ceedda140
      - name: Install pinned manifest parser
        run: python3 -m pip install -r scripts/requirements-evidence.txt
      - name: Upstream provenance and implementation test-asset check
        run: python3 scripts/check-upstream-pin.py
      - name: Snapshot checker regression tests
        run: python3 -m unittest discover -s scripts/tests -p 'test_*.py' -v
      - name: Unified Syntra implementation evidence (no formal conformance claim)
        run: python3 -B scripts/conformance_evidence.py --candidate-agreement offline --output "$RUNNER_TEMP/syntra-evidence"
      - name: Upload implementation evidence (not a conformance declaration)
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: syntra-implementation-evidence
          path: ${{ runner.temp }}/syntra-evidence
          if-no-files-found: error

  manifest-cases:
    name: unified Syntra validation + ten supplemental WSS scenarios
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: read
    env:
      SYNTRA_SDD_ROOT: ${{ github.workspace }}/../syntra-sdd
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # stable
        with:
          toolchain: "1.89.0"
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.14"
      - name: Fetch exact implementation input objects and install parser
        run: |
          git init "$SYNTRA_SDD_ROOT"
          git -C "$SYNTRA_SDD_ROOT" remote add origin https://github.com/tinkle-org/syntra.git
          git -C "$SYNTRA_SDD_ROOT" fetch --depth=1 origin 8ede3810b29fbba4d0e6ae6751a0025ceedda140
          python3 -m pip install -r scripts/requirements-evidence.txt
      - name: Unified implementation evidence regression tests
        run: >-
          python3 -B -m unittest
          scripts/tests/test_conformance_evidence.py scripts/tests/test_manifest_adapters.py -v
      - name: Current WSS scenarios (supplemental only, no formal verdicts)
        run: >-
          python3 -B scripts/conformance_evidence.py --candidate-agreement offline
          --run-local wss-envelope --run-local wss-unknown-field --run-local wss-ready
          --run-local wss-reserved-method --run-local wss-payloads --run-local wss-duplicate-id
          --run-local wss-deadline --run-local wss-internal-error
          --run-local wss-reverse-completion --run-local wss-recovery-isolation
          --output "$RUNNER_TEMP/manifest-cases"
      - name: Preserve implementation evidence and supplemental observations
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: syntra-implementation-wss-evidence
          path: ${{ runner.temp }}/manifest-cases
          if-no-files-found: error

  package:
    name: package + rustdoc validation
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # stable
        with:
          toolchain: "1.89.0"
      - name: Cargo package contents (non-publishing)
        # Metadata determines public members; publish=false test support stays
        # excluded. --list checks contents, not archives or packaged compilation.
        run: python3 scripts/cargo_contracts.py package
      - name: Rustdoc (no deps, warnings informational)
        run: cargo doc --locked --workspace --no-deps
      - name: Public API surface check (no accidental changes)
        run: |
          cargo doc --locked -p syntra-core --no-deps
          git diff --exit-code -- crates/syntra-core/src/generated || (echo "generated drift; run buf generate" >&2; exit 1)

  security:
    name: dependency security (deny + audit)
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # stable
        with:
          toolchain: "1.89.0"
      - name: Install pinned security tools
        run: |
          cargo install --locked cargo-deny --version 0.20.2
          cargo install --locked cargo-audit --version 0.22.2
      - name: cargo-audit (RustSec)
        run: cargo audit --deny warnings
      - name: cargo-deny (licenses, advisories, sources)
        run: cargo deny --locked check advisories licenses sources
      - name: Native enrollment dependency policy (optional graph is not covered by defaults)
        run: cargo deny --locked --features syntra-net/tls-rustls,syntra-net/native-enrollment check advisories licenses sources
      - name: Explicit carrier, HTTP adapter, managed runtime and proxy dependency policy
        run: cargo deny --locked --features syntra-net/http,syntra-net/tls-rustls,syntra-net/managed,syntra-net/proxy check advisories licenses sources
      - name: Opt-in runtime file-store dependency policy
        run: cargo deny --locked --features syntra-runtime/file-store check advisories licenses sources
      - name: Portable WASM dependency policy
        if: ${{ !cancelled() }}
        run: cargo deny --locked --target wasm32-unknown-unknown check advisories licenses sources

  dependency-review:
    name: dependency review
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
      pull-requests: write
    outputs:
      has_manifests: ${{ steps.base.outputs.has_manifests }}
    # Dependency review is informational when the base has no manifest or the
    # repository graph is unavailable. When the graph is readable, high-severity or
    # denied-license findings fail. cargo-deny + cargo-audit in the security
    # job remain blocking regardless.
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Check base manifests
        id: base
        env:
          GH_TOKEN: ${{ github.token }}
          BASE_REF: ${{ github.base_ref }}
          TARGET_REPO: ${{ github.repository }}
        run: |
          if gh api --method GET "repos/${TARGET_REPO}/contents/Cargo.lock" -f ref="$BASE_REF" >/dev/null 2>/tmp/gh_err.txt; then
            echo "has_manifests=true" >> "$GITHUB_OUTPUT"
          elif grep -q "HTTP 404" /tmp/gh_err.txt; then
            echo "has_manifests=false" >> "$GITHUB_OUTPUT"
          else
            cat /tmp/gh_err.txt >&2
            exit 1
          fi
      - name: Check dependency graph availability
        id: graph
        env:
          GH_TOKEN: ${{ github.token }}
          TARGET_REPO: ${{ github.repository }}
        run: |
          if gh api "repos/${TARGET_REPO}/dependency-graph/sbom" >/dev/null 2>/tmp/graph_err.txt; then
            echo "available=true" >> "$GITHUB_OUTPUT"
          elif grep -Eq "HTTP 404|Not Found" /tmp/graph_err.txt; then
            echo "available=false" >> "$GITHUB_OUTPUT"
          else
            cat /tmp/graph_err.txt >&2
            exit 1
          fi
      - name: Dependency review
        id: review
        continue-on-error: true
        uses: actions/dependency-review-action@2031cfc080254a8a887f58cffee85186f0e49e48 # v4.9.0
        with:
          fail-on-severity: high
          deny-licenses: GPL-2.0, GPL-3.0, AGPL-3.0, LGPL-2.0, LGPL-2.1, LGPL-3.0
      - name: Enforce review when graph exists
        run: |
          if [ "${{ steps.review.outcome }}" = "failure" ]; then
            if [ "${{ steps.base.outputs.has_manifests }}" = "true" ] && [ "${{ steps.graph.outputs.available }}" = "true" ]; then
              echo "Dependency review failed with graph available; failing workflow."
              exit 1
            else
              echo "Dependency review unavailable (no base graph or graph disabled/unsupported); tolerating as informational. cargo-deny + cargo-audit remain blocking."
            fi
          fi

  actionlint:
    name: actionlint workflows
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: actionlint (pinned)
        run: |
          ACTIONLINT_VERSION=v1.7.7
          curl -sSfL "https://github.com/rhysd/actionlint/releases/download/${ACTIONLINT_VERSION}/actionlint_${ACTIONLINT_VERSION#v}_linux_amd64.tar.gz" -o /tmp/actionlint.tar.gz
          tar -xzf /tmp/actionlint.tar.gz -C /tmp actionlint
          /tmp/actionlint -version
          /tmp/actionlint -color

  required:
    name: required CI status
    needs: [clippy, rust, native-macos, generated-rust, manifest-cases, package, security, actionlint, dependency-review]
    if: always()
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - name: Fail closed if any required job failed or was skipped
        run: |
          python3 - <<'EOF'
          import json, os
          results = json.loads(os.environ["NEEDS_JSON"])
          print(results)
          bad = {k: v.get("result") for k, v in results.items()}
          # Check all required jobs except dependency-review (handled separately below).
          for k, r in bad.items():
              if k == "dependency-review":
                  continue
              if r not in ("success", "skipped"):
                  raise SystemExit(f"required jobs did not all succeed: {bad}")
          # Native validation and evidence jobs are hard requirements: skipped is not success.
          # fmt is informational and does not gate this aggregate check.
          for hard in ("rust", "native-macos", "generated-rust", "manifest-cases"):
              if bad.get(hard) != "success":
                  raise SystemExit(f"hard-required job {hard} was {bad.get(hard)}")
          # Include dependency-review when it was applicable: fail required
          # if the review failed while the base graph existed. Preserve the
          # existing tolerated behavior when review was skipped or the base
          # had no manifests.
          dep = results.get("dependency-review", {})
          dep_result = dep.get("result")
          dep_manifests = (dep.get("outputs") or {}).get("has_manifests")
          if dep_manifests != "false" and dep_result not in ("success", "skipped"):
              raise SystemExit(f"dependency-review was {dep_result} with graph available: {bad}")
          print("required CI status: pass")
          EOF
        env:
          NEEDS_JSON: ${{ toJSON(needs) }}
