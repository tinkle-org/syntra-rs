name: Integration

on:
  workflow_dispatch:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: integration-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  RUSTUP_TOOLCHAIN: "1.89.0"
  CARGO_TERM_COLOR: always
  SYNTRA_INTEGRATION_REQUIRE_DOCKER: "1"

jobs:
  integration:
    name: protected channel containers (TCP + WS fixtures)
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # stable
        with:
          toolchain: "1.89.0"
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
          key: cargo-registry-${{ runner.os }}-1.89.0-${{ hashFiles('Cargo.lock') }}
          restore-keys: |
            cargo-registry-${{ runner.os }}-1.89.0-
      - name: Docker info
        run: docker info
      - name: Container integration harnesses
        # Cargo expands the quoted glob, so a harness rename does not leave a
        # stale selector; no matching integration target is still an error.
        run: cargo test --locked -p syntra-integration --test '*' -- --ignored --nocapture
