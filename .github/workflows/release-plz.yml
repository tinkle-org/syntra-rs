name: Release-plz

# Automated Release PRs and trusted-publishing releases for public workspace
# members. `release-pr` opens/updates a reviewed Release PR on pushes to
# main; `release` publishes only when that Release PR merges (release_always
# is false in release-plz.toml), so merging to main alone never publishes.
# Per-crate tags use the default `{{ package }}-v{{ version }}` pattern, which
# matches the required immutable `syntra-<crate>-vX.Y.Z` scheme.
#
# Toolchain split: `validate-release` builds and tests the crates pinned at
# rust-toolchain.toml's 1.88.0, while the tooling lanes (`release-pr` and
# `release`) run on stable rustc. The release-plz action bundles its own
# cargo-semver-checks (hard-pinned inside the action, no input to override;
# currently 0.51, which declares minimum rustc 1.93.0), and each semver-checks
# release tracks the current stable rustc, so the 1.88.0 pin must not gate
# these lanes. The job-level RUSTUP_TOOLCHAIN below overrides the workflow
# default: the dtolnay action only sets `rustup default`, which an exported
# RUSTUP_TOOLCHAIN shadows.

on:
  push:
    branches:
      - main

concurrency:
  group: release-plz-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

env:
  RUSTUP_TOOLCHAIN: "1.88.0"
  CARGO_TERM_COLOR: always

jobs:
  validate-release:
    name: Release validation
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: read
    env:
      SYNTRA_SDD_ROOT: ${{ github.workspace }}/../syntra-sdd
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # stable
        with:
          toolchain: "1.88.0"
          targets: wasm32-unknown-unknown
      - name: Install Python and Buf
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.14"
      - name: Setup Buf
        uses: bufbuild/buf-setup-action@a47c93e0b1648d5651a065437926377d060baa99 # v1.50.0
        with:
          version: "1.59.0"
          github_token: ${{ github.token }}
      - name: Install pinned candidate parser
        run: python3 -m pip install -r scripts/requirements-evidence.txt
      - name: Require and verify a committed candidate pin before publication
        # A dirty worktree record deliberately fails here. Release-plz stays
        # enabled; neither baseline HEAD nor local digests authorize publication.
        run: |
          candidate_revision="$(python3 -B scripts/protocol_contract.py --release-revision)"
          git init "$SYNTRA_SDD_ROOT"
          git -C "$SYNTRA_SDD_ROOT" remote add origin https://github.com/tinkle-org/syntra.git
          git -C "$SYNTRA_SDD_ROOT" fetch origin "$candidate_revision"
          python3 -B scripts/protocol_contract.py --release --upstream "$SYNTRA_SDD_ROOT"
      - name: Full validation plus release-profile checks
        run: |
          cargo test --locked
          cargo test --locked --workspace
          python3 scripts/cargo_contracts.py isolation
          cargo test --locked -p syntra-transport --no-default-features --features tcp,websocket,reconnect,native-enrollment
          cargo test --locked -p syntra-runtime --no-default-features --features file-store
          cargo test --locked -p syntra-ffi --no-default-features --features production
          cargo test --locked -p syntra-ffi --no-default-features --features test-fixture
          cargo check --locked -p syntra-core -p syntra-runtime --target wasm32-unknown-unknown
          cargo check --locked -p syntra-web --no-default-features --features browser-connection --target wasm32-unknown-unknown
          cargo check --locked -p syntra-web --no-default-features --features browser-test-fixture --target wasm32-unknown-unknown
          python3 crates/syntra-ffi/tests/build_contract.py
          python3 scripts/check-generated.py
          git -C "$SYNTRA_SDD_ROOT" fetch --depth=1 origin 8ede3810b29fbba4d0e6ae6751a0025ceedda140
          python3 scripts/check-upstream-pin.py
          cargo install --locked cargo-deny --version 0.20.2
          cargo install --locked cargo-audit --version 0.22.2
          cargo audit --deny warnings
          cargo deny --locked check advisories licenses sources
          cargo deny --locked --features syntra-transport/tcp,syntra-transport/websocket,syntra-transport/reconnect,syntra-transport/native-enrollment,syntra-runtime/file-store check advisories licenses sources
          cargo deny --locked --features syntra-web/browser-connection --target wasm32-unknown-unknown check advisories licenses sources
          cargo build --locked --release -p syntra-ffi --no-default-features --features production
          for symbol in syntra_client_open syntra_host_open syntra_abi_version; do
            nm -D --defined-only target/release/libsyntra_ffi.so | grep -Eq "[[:space:]]${symbol}$" || (echo "missing production symbol: $symbol" >&2; exit 1)
          done
          if nm -D --defined-only target/release/libsyntra_ffi.so | grep -Eq "[[:space:]]syntra_(ffi_|v2_)"; then echo "obsolete ABI in production release artifact" >&2; exit 1; fi
          if nm -D --defined-only target/release/libsyntra_ffi.so 2>/dev/null | grep -q "syntra_open"; then echo "test-only syntra_open in production release artifact" >&2; exit 1; fi
          python3 scripts/cargo_contracts.py package

  release-plz-release:
    name: Release-plz release
    needs: [validate-release]
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    if: github.repository_owner == 'tinkle-org'
    permissions:
      contents: write
      pull-requests: read
      id-token: write
    environment: crates-io-publish
    # Tooling lane: stable rustc, not the 1.88.0 crate pin (see header).
    env:
      RUSTUP_TOOLCHAIN: "stable"
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # stable
        with:
          toolchain: "stable"
      - name: Run release-plz release
        uses: MarcoIeni/release-plz-action@f67a7e724bdad4a0f6875f186060a0ca2770d76c # v0.5.147
        with:
          command: release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  release-plz-pr:
    name: Release-plz PR
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    if: github.repository_owner == 'tinkle-org'
    permissions:
      contents: write
      pull-requests: write
    concurrency:
      group: release-plz-pr-${{ github.ref }}
      cancel-in-progress: false
    # Tooling lane: stable rustc, not the 1.88.0 crate pin (see header).
    env:
      RUSTUP_TOOLCHAIN: "stable"
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # stable
        with:
          toolchain: "stable"
      - name: Run release-plz release-pr
        uses: MarcoIeni/release-plz-action@f67a7e724bdad4a0f6875f186060a0ca2770d76c # v0.5.147
        with:
          command: release-pr
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
