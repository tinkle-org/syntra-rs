name: Scheduled validation

on:
  schedule:
    - cron: "17 3 * * 1"
  workflow_dispatch:

concurrency:
  group: scheduled-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

env:
  RUSTUP_TOOLCHAIN: "1.89.0"
  CARGO_TERM_COLOR: always

jobs:
  full-linux:
    name: full validation (linux, 1.89.0)
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # stable
        with:
          toolchain: "1.89.0"
          targets: wasm32-unknown-unknown
          components: clippy, rustfmt
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.14"
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
          key: cargo-registry-${{ runner.os }}-1.89.0-${{ hashFiles('Cargo.lock') }}
          restore-keys: |
            cargo-registry-${{ runner.os }}-1.89.0-
      - name: Default dependency isolation (host + WASM, no dev/test graph)
        run: python3 scripts/cargo_contracts.py isolation
      - name: WebSocket-only production graph excludes TLS implementations and HTTP opt-in
        run: python3 scripts/cargo_contracts.py websocket
      - name: Managed WebSocket/routes production graph excludes TLS implementations and HTTP opt-in
        run: python3 scripts/cargo_contracts.py managed-websocket
      - name: HTTP candidate provider-only production graphs
        run: python3 scripts/cargo_contracts.py http
      - name: Candidate offline agreement (not external SDD provenance)
        run: python3 -B scripts/protocol_contract.py --offline
      - name: Locked default-members tests
        run: cargo test --locked
      - name: Locked workspace tests (carrier fixtures included)
        run: cargo test --locked --workspace
      - name: Explicit native transport and storage features
        run: |
          cargo test --locked -p syntra-net --no-default-features --features managed,proxy,tls-rustls,native-enrollment,http
          cargo test --locked -p syntra-runtime --no-default-features --features file-store
      - name: Production + fixture FFI (separate, no --all-features)
        run: |
          cargo test --locked -p syntra-ffi --no-default-features --features production
          cargo test --locked -p syntra-ffi --no-default-features --features test-fixture
          python3 crates/syntra-ffi/tests/build_contract.py
      - name: WASM baseline (core, runtime and record-protection kernel)
        run: cargo check --locked -p syntra-core -p syntra-runtime --target wasm32-unknown-unknown
      - name: Native feature entry points, nonzero regression execution and WASM rejection
        run: python3 crates/syntra-net/tests/target_contract.py

  compat-macos:
    name: native compat (macOS)
    runs-on: macos-15
    timeout-minutes: 45
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # stable
        with:
          toolchain: "1.89.0"
      - name: Locked default-members tests
        run: cargo test --locked
      - name: Locked workspace tests
        run: cargo test --locked --workspace
      - name: Isolated HTTP carrier tests
        run: cargo test --locked -p syntra-net --no-default-features --features http
      - name: Managed HTTP and proxy routes
        run: cargo test --locked -p syntra-net --no-default-features --features managed,http,proxy --test http_connections --test network_http --test routes
      - name: Managed WebSocket and proxy routes
        run: cargo test --locked -p syntra-net --no-default-features --features managed,websocket,proxy --test network_websocket --test routes
      - name: Explicit native transport and enrollment tests
        run: cargo test --locked -p syntra-net --no-default-features --features managed,proxy,tls-rustls,native-enrollment,http
      - name: Runtime file-store tests
        run: cargo test --locked -p syntra-runtime --no-default-features --features file-store
      - name: Production FFI tests
        run: cargo test --locked -p syntra-ffi --no-default-features --features production
      - name: Test-fixture FFI tests
        run: cargo test --locked -p syntra-ffi --no-default-features --features test-fixture
      # Cross-toolchain C smoke runs in CI's Linux build_contract lane; these
      # compatibility jobs exercise Rust tests, not the C compiler/symbol ABI.

  compat-windows:
    name: native compat (windows)
    runs-on: windows-2022
    timeout-minutes: 45
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # stable
        with:
          toolchain: "1.89.0"
      - name: Locked default-members tests
        run: cargo test --locked
        shell: pwsh
      - name: Locked workspace tests
        run: cargo test --locked --workspace
        shell: pwsh
      - name: Isolated HTTP carrier tests
        run: cargo test --locked -p syntra-net --no-default-features --features http
        shell: pwsh
      - name: Managed HTTP and proxy routes
        run: cargo test --locked -p syntra-net --no-default-features --features managed,http,proxy --test http_connections --test network_http --test routes
        shell: pwsh
      - name: Managed WebSocket and proxy routes
        run: cargo test --locked -p syntra-net --no-default-features --features managed,websocket,proxy --test network_websocket --test routes
        shell: pwsh
      - name: Explicit native transport and enrollment tests
        run: cargo test --locked -p syntra-net --no-default-features --features managed,proxy,tls-rustls,native-enrollment,http
        shell: pwsh
      - name: Runtime file-store tests
        run: cargo test --locked -p syntra-runtime --no-default-features --features file-store
        shell: pwsh
      - name: Production FFI tests
        run: cargo test --locked -p syntra-ffi --no-default-features --features production
        shell: pwsh
      - name: Test-fixture FFI tests
        run: cargo test --locked -p syntra-ffi --no-default-features --features test-fixture
        shell: pwsh

  coverage:
    name: coverage baseline (informational)
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # stable
        with:
          toolchain: "1.89.0"
      - name: Install cargo-llvm-cov (pinned)
        run: cargo install --locked cargo-llvm-cov --version 0.9.1
      - name: Coverage report (no threshold; not a security proof)
        run: cargo llvm-cov --locked --workspace --lcov --output-path lcov.info
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: coverage-lcov
          path: lcov.info
          retention-days: 14

  vuln-extended:
    name: extended dependency security scan
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # stable
        with:
          toolchain: "1.89.0"
      - name: Install pinned tools
        run: |
          cargo install --locked cargo-deny --version 0.20.2
          cargo install --locked cargo-audit --version 0.22.2
      - name: cargo-deny full check
        run: cargo deny --locked check
      - name: cargo-audit full
        run: cargo audit --deny warnings
      - name: Optional native carrier, enrollment and file-store policy
        run: cargo deny --locked --features syntra-net/http,syntra-net/managed,syntra-net/proxy,syntra-net/tls-rustls,syntra-net/native-enrollment,syntra-runtime/file-store check advisories licenses sources
      - name: Portable WASM dependency policy
        run: cargo deny --locked --target wasm32-unknown-unknown check advisories licenses sources
      # This workflow runs dependency checks, not fuzz or sanitizer campaigns.
