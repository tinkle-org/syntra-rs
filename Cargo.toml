[workspace]
members = [
    "crates/syntra-core",
    "crates/syntra-runtime",
    "crates/syntra-secure-channel",
    "crates/syntra-tcp",
    "crates/syntra-ws",
    "crates/syntra-ws-sc1",
    "crates/syntra-ffi",
    "crates/syntra-web",
    "crates/syntra-integration",
]
resolver = "2"

[workspace.package]
version = "1.0.0-rc.1"
edition = "2021"
rust-version = "1.88"
license = "Apache-2.0"
authors = ["Tinkle Messenger"]
repository = "https://github.com/tinkle-org/syntra-rs"
homepage = "https://github.com/tinkle-org/syntra-rs"
documentation = "https://docs.rs/syntra-core"

[workspace.dependencies]
prost = "=0.13.5"
bytes = "1"
thiserror = "2"
tracing = "0.1"
futures-util = "0.3"
url = "2"
# Minimal tokio surface (sync/time/rt/macros) so syntra-core and
# syntra-runtime also compile for wasm32-unknown-unknown. Native-only
# crates add what they need on top via target-gated dependencies.
tokio = { version = "1", default-features = false, features = ["sync", "time", "rt", "macros"] }
