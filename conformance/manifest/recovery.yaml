    preconditions: [active_session, subscription_confirmed, two_subscribers_stable, flood_ready]
    input: {faults: {flood_events: true, slow_subscriber: true}}
    expected:
      connection_state: ACTIVE
      session_state: unchanged
      frames:
        - {request_id: 0, body: notification, payload_b64: "CAEiJwgBEghoYW5kbGUtQRgHQAFKFWxvY2FsLXF1ZXVlLWV4aGF1c3RlZA=="}
      retry: "affected subscription is retired and a fresh round begins through new Subscribe; never a fabricated provider next_generation"
      hygiene: {absent_from: [unbounded_queue, silent_truncation, next_generation_on_local_overflow]}
    notes: "Subscriber-local saturation isolation: filling the affected subscriber's delivery/holding queue ends ONLY that subscription with terminated=true at the CURRENT generation 7 and non-empty ASCII terminate_reason local-queue-exhausted — no next_generation is selected and shared G is NOT incremented — so the other subscriber on the same (P, S, G) continues with valid checkpoints and the connection stays usable; an affected pending profile invocation may also fail RESOURCE_EXHAUSTED; initiator-local overflow reports local recovery-needed and cannot manufacture a provider next_generation. The expected payload is versioned RecoveryNotification bytes so a normal batch does not pass (RFC 0006 §11.4). SKIP when unclaimed. Registered; not yet executed."

  - id: CONF-URP-011
    requirement: [SYN-URP-004, SYN-URP-006, SYN-URP-014, SYN-URP-022, SYN-URP-023, SYN-URP-024, SNTR-EVENT-008, SNTR-EVENT-009]
    profile: SNTR-EVENTS-V1
    roles: [client, server]
    capabilities: [syntra.update-recovery/1]
    mandatory: false
    preconditions: [active_session, durable_checkpoint_c1, subscription_confirmed]
    input: {replay: {checkpoint_b64: "Y3Vyc29yLUs=", strategy: replay_from_start_checkpoint_then_fresh_round}, faults: {emit_live_during_replay: true, skip_batch_after_progress: true}}
    expected:
      connection_state: ACTIVE
      session_state: unchanged
      frames:
        - {request_id: 1, body: result, payload_b64: "CAESCGhhbmRsZS1BGghjdXJzb3ItSyIJY3Vyc29yLUsxKgJtMTIBQjosCAESCGhhbmRsZS1BGAciCGN1cnNvci1LKgljdXJzb3ItSzEyB2dlbmVyaWM="}
        - {request_id: 2, body: result, payload_b64: "CAESCGhhbmRsZS1BGgljdXJzb3ItSzEiAUIqADIBQjolCAESCGhhbmRsZS1BGAciCWN1cnNvci1LMSoBQjIHZ2VuZXJpYw=="}
        - {request_id: 0, body: notification, payload_b64: "CAESCGhhbmRsZS1BGAciAUI="}
        - {request_id: 5, body: request, shape: RecoverySubscribeRequest, note: "subscribe with start_checkpoint=c2 after retiring handle-A"}
      hygiene: {absent_from: [moving_boundary, silent_truncation, same_handle_second_round, obsolete_boundary_replay]}
    notes: "Fixed-boundary round and fresh-handle second gap: replay from the durable known-safe checkpoint c1 returns pages as one RecoveryReplayPage payload per correlated RpcResult (never a page Notification), held live batches release only after a validated completion matching connection+handle-A+generation 7+version+exact boundary B (`replay_complete` at boundary B for handle-A), and the boundary never moves during the round. After durable progress c2 beyond boundary B, a subsequent gap retires handle-A locally (held queue and cursors cleared) and a fresh Subscribe(start_checkpoint=c2) yields a new handle with a NEWLY captured boundary; recovery runs toward the new boundary, never toward the obsolete one, with no same-handle second round and no marker reset (expected request frame carries a RecoverySubscribeRequest, not a same-handle Replay reset). SKIP when unclaimed. Registered; not yet executed."

  - id: CONF-URP-012
    requirement: [SYN-URP-014, SYN-URP-022, SYN-URP-024, SNTR-REL-005]
