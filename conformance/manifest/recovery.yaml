# Portable recovery cases. RFC 0006 is accepted; its §11 decision amendment is
# authoritative. Case reconciliation per conformance/plans/update-recovery.md §4
# and RFC 0006 §11.8: CONF-URP-001/002/003/007 retain their intent (with scoped
# identity, fresh-round fencing, and durable-safe resume added); CONF-URP-004/011
# were corrected to the §11 shapes (replay pages delivered in the correlated
# RpcResult, fixed-boundary rounds with a fresh handle for the second gap);
# CONF-URP-005/006 were extended (snapshot transfer shape, no-wire completion,
# same-G local install, coordinated S0 binding); CONF-URP-009/010 were replaced
# (true scoped provider loss with next_generation trailer fencing; subscriber-
# local saturation with terminated=true and ASCII local-queue-exhausted, no
# next_generation); CONF-URP-012..017 are new §11 coverage. Requirement traces
# use the accepted SYN-URP-* IDs (SYN-URP-008/009 reserved, unassigned) plus
# meaningful SNTR-* core IDs.
# Registration is NOT execution: every case below is a planned, not-executed
# executable specification. No verdict here is an execution result. Prose
# companion: ../recovery_profile/recovery.md.
# Optionality rule: any case whose capabilities are unadvertised MUST yield
# UNSUPPORTED (correct UNIMPLEMENTED refusal) or SKIP — never FAIL.
format_version: "1.0"
profile: SNTR-EVENTS-V1
cases:
  - id: CONF-URP-001
    requirement: [SYN-URP-001, SYN-URP-010, SYN-URP-020, SNTR-CAP-003, SNTR-CAP-010, SNTR-CAP-020, SNTR-EVENT-001, SNTR-EVENT-011]
    profile: SNTR-EVENTS-V1
    roles: [server]
    capabilities: [syntra.update-recovery/1]
    mandatory: false
    preconditions: [active_session]
    input:
      frames:
        - {request_id: 3, body: request, method: "/syntra.v1.UpdateRecovery/Subscribe", payload_b64: "CAESDnN1YnNjcmlwdGlvbi1h"}
    expected:
      connection_state: ACTIVE
      session_state: unchanged
      error: {code: UNIMPLEMENTED}
    control_connection:
      preconditions: [active_session]
      frames:
        - {request_id: 1, body: request, method: "/syntra.v1.UpdateRecovery/Negotiate", payload_b64: "CAEQARgBIhhzeW50cmEudXBkYXRlLXJlY292ZXJ5LzE="}
        - {request_id: 3, body: request, method: "/syntra.v1.UpdateRecovery/Subscribe", payload_b64: "CAESDnN1YnNjcmlwdGlvbi1h"}
      expected:
        connection_state: ACTIVE
        session_state: unchanged
        frames:
          - {request_id: 1, body: result, shape: RecoveryNegotiateResponse, note: "selected_version 1 confirmed with the deployment bounds; the profile is confirmed on this connection only"}
          - {request_id: 3, body: result, shape: RecoverySubscribeResponse, note: "fresh connection-scoped handle with a newly captured boundary"}
      notes: "Runner-driven paired control on a fresh connection to the same recovery-capable host, bound principal, authorization scope, and stream selector as the case-level probe connection."
    notes: "Mandatory-only fallback and per-connection negotiation isolation on one recovery-capable Host: both connections target the same host, bound principal, authorization scope, and stream selector, and the Host's mandatory service continues on the unconfirmed connection. UNCONFIRMED PROBE CONNECTION: no Negotiate is run and the profile is not confirmed; the runner deliberately injects the otherwise valid initial-subscription RecoverySubscribeRequest — profile_version 1, a non-empty stream_selector within bounds, and the valid empty start_checkpoint initial-subscription sentinel (SYN-URP-021: start_checkpoint MAY be empty; empty means initial subscription) — as a negative test, because a conforming initiator MUST NOT send profile operations before confirmation (SYN-URP-001); this injection is therefore runner-driven only. The host replies UNIMPLEMENTED (SYN-URP-010: the operation belongs to a profile not confirmed on this connection, and an unknown operation is likewise UNIMPLEMENTED), so the refusal is attributed to the confirmation gate by the paired control rather than by the error code alone. No handle and no checkpoint are created on the unconfirmed connection, including by the checkpoint_issued_for_handle path, because Subscribe itself requires confirmation. request_id 3 is nonzero and admitted as increasing on its connection (RFC 0004), so the refusal is not a request-ID violation. CONTROL CONNECTION (runner-driven, fresh connection to the same host): Negotiate (request_id 1) returns selected_version 1 with the confirmed deployment bounds, confirming the profile on that connection only, and the exact same valid Subscribe payload (request_id 3) then succeeds with a fresh connection-scoped handle and a newly captured boundary, so the confirmation gate is the sole delta; request IDs are independently valid within each connection. Negotiation and confirmation on the control connection never enable the profile on the unconfirmed one; partial acceptance falls back to mandatory-only plus previously confirmed options (SYN-URP-001). The durable known-safe resumption shape is CONF-URP-015's coverage. RFC 0006 §11.1 release-bundle inclusion does not relax the per-connection gate. SKIP when unclaimed. Registered; not yet executed."

  - id: CONF-URP-002
    requirement: [SYN-URP-003, SYN-URP-004, SNTR-EVENT-007, SNTR-REL-005]
    profile: SNTR-EVENTS-V1
    roles: [client, server]
    capabilities: [syntra.update-recovery/1]
    mandatory: false
    preconditions: [active_session, subscription_confirmed]
    input: {faults: {emit_duplicate_event: true}}
    expected:
      connection_state: ACTIVE
      session_state: unchanged
      hygiene: {absent_from: [violation, error_storm]}
    notes: "Duplicate tolerance across the recovered and live boundary: initiator tolerates the duplicate with no violation and no error storm, skipping an already applied result checkpoint only after version, handle/scope, generation, authorization, and bounds validation; equal checkpoint bytes from another connection, handle, generation, or principal context are not a duplicate. SKIP when unclaimed. Registered; not yet executed."

  - id: CONF-URP-003
    requirement: [SYN-URP-003, SYN-URP-004, SYN-URP-012, SNTR-EVENT-006, SNTR-EVENT-021]
    profile: SNTR-EVENTS-V1
    roles: [client, server]
    capabilities: [syntra.update-recovery/1]
    mandatory: false
    preconditions: [active_session, subscription_confirmed]
    input: {faults: {emit_batches: 3, skip_batch: true}}
    expected:
      connection_state: ACTIVE
      session_state: unchanged
      frames:
        - {request_id: 0, body: notification}
    notes: "Gap detection by predecessor chaining without arithmetic on checkpoint bytes and without structural parsing of checkpoint or binding binaries; the initiator reports local recovery-needed, does not treat idle as caught-up, and no generation change results. Harness fault injection provides the gap. SKIP when unclaimed. Registered; not yet executed."

  - id: CONF-URP-004
    requirement: [SYN-URP-004, SYN-URP-014, SYN-URP-022, SYN-URP-023, SNTR-EVENT-008, SNTR-EVENT-009]
    profile: SNTR-EVENTS-V1
    roles: [client, server]
    capabilities: [syntra.update-recovery/1]
    mandatory: false
    preconditions: [active_session, subscription_confirmed, replay_retained]
    input: {replay: {checkpoint_b64: "Y3Vyc29yLUs=", strategy: replay_from_start_checkpoint, pages: 3}}
    expected:
      connection_state: ACTIVE
      session_state: unchanged
      frames:
        - {request_id: 1, body: result, shape: RecoveryReplayPage, note: "one bare RecoveryReplayPage per correlated RpcResult"}
        - {request_id: 2, body: result, shape: RecoveryReplayPage}
        - {request_id: 3, body: result, shape: RecoveryReplayPage}
      hygiene: {absent_from: [unbounded_burst, page_notification]}
    notes: "Replay paging correct shape: oversized history returns bounded replay pages — exactly one RecoveryReplayPage payload per correlated RpcResult, each page stating its continuation marker and the round's fixed catch-up boundary; pages are never delivered as page Notifications (recoverable Notification payloads carry batch/replay_complete/trailer outcomes only). Initiator echoes markers verbatim and stops at the boundary; held live batches are not released before a validated completion matching connection+handle+generation+version+exact boundary (RFC 0006 §11.3). Hygiene forbids burst beyond bounds and any page-as-Notification outcome. SKIP when unclaimed. Registered; not yet executed."

  - id: CONF-URP-005
    requirement: [SYN-URP-012, SYN-URP-015, SNTR-EVENT-009]
    profile: SNTR-EVENTS-V1
    roles: [client, server]
    capabilities: [syntra.update-recovery/1]
    mandatory: false
    preconditions: [active_session, cursor_expired]
    input: {replay: {checkpoint_b64: "ZXhwaXJlZC1jdXJzb3I=", strategy: replay_from_start_checkpoint}}
    expected:
      connection_state: ACTIVE
      session_state: unchanged
      error: {code: FAILED_PRECONDITION}
      frames:
        - {request_id: 0, body: notification}
      hygiene: {absent_from: [silent_restart, generation_increment, binding_invalidation]}
    notes: "Expired continuation with snapshot-required signal: replay from the outside-retention checkpoint yields FAILED_PRECONDITION in the failed replay RpcResult while the snapshot-required signal arrives as the trailer Notification; the checkpoint binding (P, S, G) stays valid and the generation is NOT incremented for a retention-window miss (RFC 0006 §11.2), which is distinct from silent restart and from true provider loss. Recovery follows the snapshot path. SKIP when unclaimed. Registered; not yet executed."

  - id: CONF-URP-006
    requirement: [SYN-URP-016, SYN-URP-021, SYN-URP-025, SNTR-EVENT-008]
    profile: SNTR-EVENTS-V1
    roles: [client, server]
