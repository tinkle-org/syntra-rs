    preconditions: [active_session, flood_ready]
    input: {faults: {flood_events: true}}
    expected:
      connection_state: ACTIVE
      session_state: unchanged
      error: {code: RESOURCE_EXHAUSTED}
      hygiene: {absent_from: [unbounded_queue, silent_truncation]}
    notes: "Reject-new-work before acceptance: saturation of host resources before an affected subscription is accepted yields RESOURCE_EXHAUSTED with documented backoff while existing subscriptions continue (RFC 0006 §11.4: rejecting new work before a saturated subscription is accepted remains valid). Runs only when the host documents the reject-new-work policy (SKIP CONF-URP-008 otherwise). Never unbounded queueing and never silent truncation without the documented signal. SKIP when unclaimed. Registered; not yet executed."

  - id: CONF-URP-009
    requirement: [SYN-URP-012, SYN-URP-013, SYN-URP-026, SNTR-EVENT-030]
    profile: SNTR-EVENTS-V1
    roles: [client, server]
    capabilities: [syntra.update-recovery/1]
    mandatory: false
    preconditions: [active_session, subscription_confirmed, two_scopes_stable, provider_loss_barrier]
    input:
      faults: {provider_history_loss: true}
      frames:
        - {request_id: 1, body: request, method: "/syntra.v1.UpdateRecovery/Replay", payload_b64: "CAESCGhhbmRsZS1BGg1jaGVja3BvaW50LWM3IAEoAQ==", generation: 7}
        - {request_id: 2, body: request, method: "/syntra.v1.UpdateRecovery/Confirm", payload_b64: "CAESCGhhbmRsZS1BGAciDWNoZWNrcG9pbnQtYzc=", generation: 7}
    expected:
      connection_state: ACTIVE
      session_state: unchanged
      frames:
        - {request_id: 0, body: notification, payload_b64: "CAEiEAgBEghoYW5kbGUtQRgHKAg="}
      error: {code: FAILED_PRECONDITION}
      hygiene: {absent_from: [silent_invalidation, checkpoint_reinterpretation, mixed_generation_work]}
    notes: "Scoped generation invalidation by true provider history loss: the host changes the scoped generation once and signals explicitly with a versioned RecoveryBatchTrailer whose generation=7 (old G) and next_generation=8 (new G) for the affected (P, S) scope — the expected payload is versioned RecoveryNotification bytes so a normal batch does not pass. Old-generation pages, offers, confirmations, and batches are fenced and fail FAILED_PRECONDITION with no mixed-generation work; subscribers of unaffected scopes keep valid bindings. SELECTED on true provider loss or explicit shared rebase ONLY — an ordinary retention-window miss or local queue saturation never produces this trailer. SKIP when unclaimed. Registered; not yet executed."

  - id: CONF-URP-010
    requirement: [SYN-URP-007, SYN-URP-017, SYN-URP-018, SYN-URP-026, SNTR-EVENT-030, SNTR-REL-007]
    profile: SNTR-EVENTS-V1
    roles: [client, server]
    capabilities: [syntra.update-recovery/1]
