    expected:
      connection_state: ACTIVE
      session_state: unchanged
      frames:
        - {request_id: 0, body: notification, payload_b64: "CAESCGhhbmRsZS1BGAciAUI="}
      retry: "repeat the exact preceding Replay (or same CatchUp) payload with fresh RPC request IDs under documented finite attempts and an absolute deadline; never a same-handle second round or marker reset"
      hygiene: {absent_from: [idle_as_caught_up, tight_loop, rerun_effects]}
    notes: "Lost completion and bounded exact retry: while the round stays current, the host returns the retained page/acceptance verbatim without advancing pagination and re-emits the round's completion (same handle, same generation, same boundary — expected payload is the re-emitted RecoveryReplayComplete for handle-A boundary B); duplicate completions are idempotent and do not re-offer data. On retry or deadline budget exhaustion the initiator retires the handle locally (queue, cursors, pending offers cleared) and starts a fresh round through a new Subscribe from the durable known-safe checkpoint — no same-handle second round and no marker reset. SKIP when unclaimed. Registered; not yet executed."

  - id: CONF-URP-013
    requirement: [SYN-URP-016, SYN-URP-025, SNTR-EVENT-008]
    profile: SNTR-EVENTS-V1
    roles: [client, server]
    capabilities: [syntra.update-recovery/1]
    mandatory: false
    preconditions: [active_session, subscription_confirmed, snapshot_required]
    input: {faults: {snapshot_supersede: true}}
    expected:
      connection_state: ACTIVE
      session_state: unchanged
      error: {code: FAILED_PRECONDITION}
      hygiene: {absent_from: [partial_install, cross_boundary_install, equal_boundary_reuse]}
    notes: "Superseding an offer retires the handle: gap, continuity-loss, or continuation-expiry reports invalidate any pending offer and the initiator MUST Subscribe again for a fresh handle before a new snapshot handle X is issued — even when the new provider boundary bytes equal the old S0 and the generation is unchanged (RFC 0006 §11.5); in-flight SnapshotFetch under the superseded X or the retired handle fails FAILED_PRECONDITION; staged pages are discarded, never partially installed, never installed across boundaries; old confirmations under a retired handle cannot install; exact duplicate SnapshotOffer under the active handle returns the retained descriptor rather than a second offer. SKIP when unclaimed. Registered; not yet executed."

  - id: CONF-URP-014
    requirement: [SYN-URP-002, SYN-URP-016, SYN-URP-021, SNTR-EVENT-008]
    profile: SNTR-EVENTS-V1
    roles: [client, server]
