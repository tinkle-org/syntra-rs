# SC1/WSS profile cases. Profile: SNTR-SC1-WSS-V1 (RFC 0007 §11.4).
# Prose owners: specifications/transports/noise-bindings.md and
# specifications/security/secure-channel.md. Registration is not execution.
# RFC 0010 (accepted 2026-10-30 via docs/decisions/0002-sdd-acceptance-wave.md)
# added the planned lifecycle rows CONF-SCW-025–038 below for the host
# enrollment/authorization requirements SNTR-DAUTH-011–024
# (specifications/security/device-authorization.md §5). Every row is a
# registered, planned, not-executed executable specification; no verdict, run
# result or CONF-* execution is claimed here.
format_version: "1.0"
profile: SNTR-SC1-WSS-V1
cases:
  - id: CONF-SCW-001
    requirement: [SNTR-SCW-001, SNTR-SC-013]
    profile: SNTR-SC1-WSS-V1
    roles: [client, server]
    capabilities: []
    mandatory: true
    preconditions: [transport_connected]
    input:
      transport:
        action: websocket_upgrade
        path: /syntra/v1/sc1/ws
        subprotocol: syntra.sc1.v1
        carrier: 3
    expected:
      connection_state: CONNECTED
      session_state: none
      transport: { upgrade_status: 101, subprotocol: syntra.sc1.v1, compression: disabled }
    notes: "Positive selection. Repeat with /syntra/v1/ws, syntra.v1 and syntra.sc1.draft1: each MUST fail without SC1 bytes or fallback."

  - id: CONF-SCW-002
    requirement: [SNTR-SCW-002, SNTR-SC-003]
    profile: SNTR-SC1-WSS-V1
    roles: [client, server]
    capabilities: []
    mandatory: true
    preconditions: [transport_connected, valid_chain]
    input:
      transport:
        action: sc1_handshake
        contexts: [SC1-CONTEXT-02, SC1-CONTEXT-04]
        vectors: conformance/test-vectors/sc1/context-vectors.yaml
    expected:
      connection_state: ACTIVE
      session_state: active
      transport: { context_matches: true, prologue_matches: true, carrier: 3 }
    notes: "Exact WSS context/prologue bytes for bootstrap and returning modes, including multibyte UTF-8 scope. The context MUST equal the prologue and the M1 prefix. SC1-CONTEXT-03 is exercised as a carrier-mismatch rejection in CONF-SCW-017."

  - id: CONF-SCW-003
    requirement: [SNTR-SCW-003, SNTR-SC-001, SNTR-SC-004, SNTR-SC-005]
    profile: SNTR-SC1-WSS-V1
    roles: [client, server]
    capabilities: []
    mandatory: true
    preconditions: [transport_connected, valid_chain]
    input:
      transport:
        action: sc1_handshake
        m1_bytes: [86, 340]
        m2_bytes: 48
        payloads: empty
        modes: [bootstrap, returning]
    expected:
      connection_state: ACTIVE
      session_state: active
      transport: { handshake_payload_bytes: 0, fresh_ephemeral: true }
    notes: "Both modes. Non-empty handshake payloads, unexpected lengths, wrong PSK and wrong suite fail with no protected dispatch."

  - id: CONF-SCW-004
    requirement: [SNTR-SCW-004, SNTR-TSEC-003, SNTR-TSEC-004]
    profile: SNTR-SC1-WSS-V1
    roles: [client]
    capabilities: []
    mandatory: true
    preconditions: [transport_connected, invalid_chain]
    input:
      transport:
        action: tls_connect
        pki: test-pki-wrong-host
        noise_pin: wrong-key
    expected:
      connection_state: CLOSED
      session_state: none
      error: { code: UNAVAILABLE }
      hygiene: { absent_from: [credential, token, "PRIVATE KEY"] }
    notes: "TLS identity failure and Noise pin failure are independent terminal failures. No hello, credential or fallback. Repeat with a valid chain and wrong pin."

  - id: CONF-SCW-005
    requirement: [SNTR-SCW-005, SNTR-SC-007]
    profile: SNTR-SC1-WSS-V1
    roles: [client, server]
    capabilities: []
    mandatory: true
    preconditions: [transport_connected, active_session]
    input:
      transport:
        action: send_ws_messages
        message_kinds: [binary, fragmented_binary]
        records_per_message: 1
        sc1_prefix: none
    expected:
      connection_state: ACTIVE
      session_state: unchanged
      transport: { binary_accepted: true, fragments_reassembled: true, sc1_prefix: none }
    notes: "Success path only: active-session protected records. One reassembled binary message per record, with no u16BE SC1 prefix. Ping/Pong/Close never complete an RPC or confirm a channel. Non-binary and malformed messages are covered by CONF-SCW-019; pre-session fragmented M1/M2 coverage is CONF-SCW-021."

  - id: CONF-SCW-021
    requirement: [SNTR-SCW-003, SNTR-SCW-005, SNTR-SC-002]
    profile: SNTR-SC1-WSS-V1
    roles: [client, server]
    capabilities: []
    mandatory: true
    preconditions: [transport_connected, handshake_started, valid_chain]
    input:
      transport:
        action: send_ws_messages
        message_kinds: [fragmented_m1, fragmented_m2]
        records_per_message: 1
        sc1_prefix: none
        phase: pre_ready
    expected:
      connection_state: ACTIVE
      session_state: active
      transport: { fragments_reassembled: true, handshake_messages_intact: true }
    notes: "Pre-session-activation probe: fragmented M1 and M2 are each reassembled into one binary message before Noise processing. This is separate from the active-session protected-record success path in CONF-SCW-005."

  - id: CONF-SCW-006
    requirement: [SNTR-SCW-006, SNTR-SC-013]
    profile: SNTR-SC1-WSS-V1
    roles: [client, server]
    capabilities: []
    mandatory: true
    preconditions: [transport_connected]
    input:
      transport:
        action: websocket_upgrade
        path: /syntra/v1/sc1/ws
        headers: { Authorization: "Bearer fixture", Cookie: "session=fixture" }
        origin: "https://fixture.invalid"
    expected:
      connection_state: CLOSED
      session_state: none
      transport: { upgrade_status: 400 }
      hygiene: { absent_from: [fixture, credential, token] }
    notes: "Authorization and Cookie are rejected. Origin and forwarded headers are not authentication. No Syntra credential in the Upgrade. Repeat with a missing/wrong subprotocol. Client-side rejection of an invalid 101/Sec-WebSocket-Accept response without sending M1 is CONF-SCW-024."

  - id: CONF-SCW-024
    requirement: [SNTR-SCW-006]
    profile: SNTR-SC1-WSS-V1
    roles: [client]
    capabilities: []
    mandatory: true
    preconditions: [transport_connected]
    input:
      transport:
        action: websocket_upgrade
        path: /syntra/v1/sc1/ws
        subprotocol: syntra.sc1.v1
        server_response: { upgrade_status: 101, sec_websocket_accept: invalid }
    expected:
      connection_state: CLOSED
      session_state: none
      transport: { upgrade_response_validated: true, m1_sent: false }
      hygiene: { absent_from: [credential, token] }
    notes: "Client-side validation: a 101 response whose Sec-WebSocket-Accept is invalid causes the client to close with no M1 and no Noise material. Host-side rejection with HTTP 400 of forbidden request headers is CONF-SCW-006."

  - id: CONF-SCW-007
    requirement: [SNTR-SCW-007, SNTR-TSEC-008]
    profile: SNTR-SC1-WSS-V1
    roles: [client, server]
    capabilities: []
    mandatory: true
    preconditions: [transport_connected]
    input:
      transport:
        action: websocket_upgrade
        terminated_by: proxy
        forwarded_proto: https
        forwarded_for: "203.0.113.7"
    expected:
      connection_state: CLOSED
      session_state: none
      error: { code: UNAVAILABLE }
    notes: "Direct verified TLS termination by the host is the initial permitted topology. Proxy termination and forwarded carrier claims are refused. Do not infer carrier 3 from a header."

  - id: CONF-SCW-008
    requirement: [SNTR-SCW-008, SNTR-SC-013]
    profile: SNTR-SC1-WSS-V1
    roles: [client, server]
    capabilities: []
    mandatory: true
    preconditions: [transport_connected]
    input:
      transport: { action: connect, carrier: 1, production_claim: true }
    expected:
      connection_state: CLOSED
      session_state: none
      error: { code: UNAVAILABLE }
    notes: "SC1/TCP and SC1/WS are restricted development carriers and are disabled by default in production-claiming distributions. TLS over a development stream does not become carrier 3."

  - id: CONF-SCW-009
    requirement: [SNTR-SCW-009, SNTR-SC-007]
    profile: SNTR-SC1-WSS-V1
    roles: [client, server]
    capabilities: []
    mandatory: true
    preconditions: [transport_connected, active_session]
    input:
      transport:
        action: sc1_record
        plaintext_bytes: [1, 65519]
        ciphertext_bytes: [17, 65535]
        associated_data: empty
    expected:
      connection_state: ACTIVE
      session_state: unchanged
      transport: { max_plaintext: 65519, max_ciphertext: 65535, ad_empty: true }
    notes: "Success path only: boundary record sizes and empty AD. Oversize, truncated-tag and non-empty-AD rejection is covered by CONF-SCW-020. Carrier headers are not authenticated AD."

  - id: CONF-SCW-010
    requirement: [SNTR-SCW-010, SNTR-SC-008]
    profile: SNTR-SC1-WSS-V1
    roles: [client, server]
    capabilities: []
    mandatory: true
    preconditions: [transport_connected, active_session]
    input:
      transport:
        action: sc1_stream
        frame_bytes: [1, 1048576]
        frame_1048577: reject
        splits: every_record_boundary
        coalesced_frames: true
    expected:
      connection_state: ACTIVE
      session_state: unchanged
      transport: { frames_dispatched_once: true, partial_dispatch: false }
    notes: "Prefixes and frames may span records; multiple complete frames may share a record. No resynchronization, partial decode or allocation above the declared bound."

  - id: CONF-SCW-011
    requirement: [SNTR-SCW-011, SNTR-SC-006, SNTR-DAUTH-010]
    profile: SNTR-SC1-WSS-V1
    roles: [client, server]
    capabilities: []
    mandatory: true
    preconditions: [transport_connected, valid_chain]
    input:
      transport:
        action: sc1_first_envelope
        envelope: one_complete_hello
        may_span_records: true
        trailing_envelope: none
        extra_complete_envelope: reject
        extra_partial_envelope: reject
    expected:
      connection_state: ACTIVE
      session_state: active
      frames:
        - { request_id: 0, body: hello }
        - { request_id: 0, body: ready }
    notes: "The record completing the hello ends at its boundary. No protected dispatch or sensitive output before hello validation, current-enrollment/same-principal policy and ready. A replayed M1 confirms nothing."

  - id: CONF-SCW-012
    requirement: [SNTR-SCW-012, SNTR-SC-009, SNTR-SC-011, SNTR-SC-012, SNTR-SC-014, SNTR-DAUTH-009]
    profile: SNTR-SC1-WSS-V1
    roles: [client, server]
    capabilities: []
    mandatory: true
    preconditions: [transport_connected, active_session, connection_lost]
    input:
      transport:
        action: sc1_limits
        lifetime_s: 86400
        records_per_direction: 4294967296
        writer_stall: true
        reconnect: fresh_handshake
        replay: none
    expected:
      connection_state: CLOSED
      session_state: terminated_abnormally
      retry: "fresh-handshake-only"
    notes: "Counter/lifetime exhaustion closes without wrapping. A stalled writer aborts or completes within budget and never re-encrypts a consumed nonce. Reconnect uses fresh keys and does not replay RPCs or resume the session."

  - id: CONF-SCW-013
    requirement: [SNTR-SCW-002, SNTR-SC-003, SNTR-SC-010]
    profile: SNTR-SC1-WSS-V1
    roles: [client, server]
    capabilities: []
    mandatory: true
    preconditions: [transport_connected]
    input:
      transport:
        action: sc1_context_negatives
        recipes: [SC1-N01, SC1-N02, SC1-N03, SC1-N04, SC1-N05, SC1-N06, SC1-N07, SC1-N08, SC1-N09, SC1-N10, SC1-N11, SC1-N12]
        vectors: conformance/test-vectors/sc1/context-vectors.yaml
    expected:
      connection_state: CLOSED
      session_state: none
      error: { code: UNAVAILABLE }
      hygiene: { absent_from: [credential, token, "PRIVATE KEY"] }
    notes: "Legacy domain/magic, zero mode, unknown carrier, bootstrap epoch, zero returning handle, empty/oversize/truncated/trailing/invalid-UTF-8 scope and character-count length all fail before Noise or credential lookup."

  - id: CONF-SCW-014
    requirement: [SNTR-SC-004, SNTR-SC-006, SNTR-SC-010, SNTR-DAUTH-008]
    profile: SNTR-SC1-WSS-V1
    roles: [client, server]
    capabilities: []
    mandatory: true
    preconditions: [transport_connected, handshake_started]
    input:
      transport:
        action: sc1_replay
        replay_m1: true
        omit_m2: true
        corrupt_m2: true
        pre_ready_request: true
    expected:
      connection_state: CLOSED
      session_state: none
      error: { code: UNAVAILABLE }
      hygiene: { absent_from: [credential, token] }
    notes: "Replayed M1 may elicit a bounded M2 but MUST NOT invoke host policy, bind a principal or dispatch. No hello/credential before verified M2; no protected request before ready."

  - id: CONF-SCW-015
    requirement: [SNTR-DAUTH-001, SNTR-DAUTH-003]
    profile: SNTR-SC1-WSS-V1
    roles: [client, server]
    capabilities: []
    mandatory: true
    preconditions: [transport_connected]
    input:
      credentials: "fixture:sc1-preprovisioned"
      transport:
        action: sc1_key_validation
        ak_bytes: 32
        zero_ak: reject
        zero_handle_returning: reject
        zero_epoch_returning: reject
        handle_collision: reject
    expected:
      connection_state: CLOSED
      session_state: none
      error: { code: UNAUTHENTICATED }
      hygiene: { absent_from: [credential, token, "PRIVATE KEY"] }
    notes: "AK is 32 random bytes and enters only the PSK input. Handle is eight opaque bytes, independent of the key and principal. Collisions fail or are resolved by the documented bounded procedure."

  - id: CONF-SCW-016
    requirement: [SNTR-DAUTH-005, SNTR-DAUTH-010]
    profile: SNTR-SC1-WSS-V1
    roles: [client, server]
    capabilities: []
    mandatory: true
    preconditions: [transport_connected, valid_chain]
    input:
      credentials: "fixture:sc1-principal"
      transport:
        action: sc1_policy
        enrollment_principal: principal-a
        channel_principal: principal-b
    expected:
      connection_state: CLOSED
      session_state: none
      error: { code: PERMISSION_DENIED }
      hygiene: { absent_from: [credential, token] }
    notes: "Returning policy principal differing from the trusted enrollment principal fails before ready; no privilege union, ready or protected effect. Empty credentials never select the channel principal. Denied-method-after-ready behavior is CONF-SCW-018."

  - id: CONF-SCW-017
    requirement: [SNTR-SCW-002, SNTR-SC-003, SNTR-SC-010]
    profile: SNTR-SC1-WSS-V1
    roles: [client, server]
    capabilities: []
    mandatory: true
    preconditions: [transport_connected, valid_chain]
    input:
      transport:
        action: sc1_handshake
        contexts: [SC1-CONTEXT-03]
        vectors: conformance/test-vectors/sc1/context-vectors.yaml
        expected_carrier: 3
    expected:
      connection_state: CLOSED
      session_state: none
      error: { code: UNAVAILABLE }
    notes: "SC1-CONTEXT-03 encodes carrier 2 (WS). Under SNTR-SC1-WSS-V1 the responder requires carrier 3 and MUST reject this context before Noise or credential lookup. This vector is a negative case for this profile, not a WSS success vector."

  - id: CONF-SCW-018
    requirement: [SNTR-DAUTH-005, SNTR-DAUTH-010]
    profile: SNTR-SC1-WSS-V1
    roles: [client, server]
    capabilities: []
    mandatory: true
    preconditions: [transport_connected, active_session]
    input:
      credentials: "fixture:sc1-principal"
      transport:
        action: sc1_method_denial
        principal: principal-a
        method: "/example.Admin/Reset"
    expected:
      connection_state: ACTIVE
      session_state: unchanged
      error: { code: PERMISSION_DENIED }
      hygiene: { absent_from: [credential, token] }
    notes: "After ready, a denied method returns one terminal PERMISSION_DENIED result, has no handler effect and leaves the connection usable. This is distinct from the pre-ready principal mismatch in CONF-SCW-016."

  - id: CONF-SCW-019
    requirement: [SNTR-SCW-005, SNTR-SC-007, SNTR-SC-010]
    profile: SNTR-SC1-WSS-V1
    roles: [client, server]
    capabilities: []
    mandatory: true
    preconditions: [transport_connected, active_session]
    input:
      transport:
        action: send_ws_messages
        message_kinds: [text, compressed, empty, truncated]
        records_per_message: 1
        sc1_prefix: none
    expected:
      connection_state: CLOSED
      session_state: terminated_abnormally
      error: { code: UNAVAILABLE }
      transport: { text_rejected: true, compressed_rejected: true, empty_rejected: true, truncated_rejected: true }
    notes: "Rejection path only: text, compressed, empty and truncated messages fail without protected dispatch. Binary and fragmented success is CONF-SCW-005."

  - id: CONF-SCW-020
    requirement: [SNTR-SCW-009, SNTR-SC-007, SNTR-SC-010]
    profile: SNTR-SC1-WSS-V1
    roles: [client, server]
    capabilities: []
    mandatory: true
    preconditions: [transport_connected, active_session]
    input:
      transport:
        action: sc1_record
        plaintext_bytes: 65520
        ciphertext_bytes: 65536
        tag: full
        associated_data: empty
    expected:
      connection_state: CLOSED
      session_state: terminated_abnormally
      error: { code: UNAVAILABLE }
    notes: "Isolates the oversize condition: an otherwise valid record with plaintext 65,520 and ciphertext 65,536 fails closed. Boundary-size success with empty AD is CONF-SCW-009."

  - id: CONF-SCW-022
    requirement: [SNTR-SCW-009, SNTR-SC-007, SNTR-SC-010]
    profile: SNTR-SC1-WSS-V1
    roles: [client, server]
    capabilities: []
    mandatory: true
    preconditions: [transport_connected, active_session]
    input:
      transport:
        action: sc1_record
        plaintext_bytes: 1
        ciphertext_bytes: 17
        truncated_tag: true
        associated_data: empty
    expected:
      connection_state: CLOSED
      session_state: terminated_abnormally
      error: { code: UNAVAILABLE }
    notes: "Isolates the truncated-tag condition: size bounds and AD are otherwise valid; the record fails closed."

  - id: CONF-SCW-023
    requirement: [SNTR-SCW-009, SNTR-SC-007, SNTR-SC-010]
    profile: SNTR-SC1-WSS-V1
    roles: [client, server]
    capabilities: []
    mandatory: true
    preconditions: [transport_connected, active_session]
    input:
      transport:
        action: sc1_record
        plaintext_bytes: 1
        ciphertext_bytes: 17
        tag: full
        associated_data: non_empty
    expected:
      connection_state: CLOSED
      session_state: terminated_abnormally
      error: { code: UNAVAILABLE }
    notes: "Isolates the non-empty associated-data condition: size bounds and tag are otherwise valid; the record fails closed."

  # ---- RFC 0010 lifecycle rows: registered, planned cases for SNTR-DAUTH-011–024 (not executed) ----
  # Prose companion: conformance/plans/secure-channel.md §§7–8 (PLAN-DAUTH-011–024
  # and the §8 fault matrices/time budgets). Each row exercises host store and
  # device observation surfaces around the SC1 channel, not new wire bytes: this
  # registry defines no wire field and adds no Frame variant. CONF-SCW-039–042
  # are supplemental registration splits of 025/030 (out-of-band path, valid-but-
  # unauthorized enrollments, mid-connection rebinding); still registered, not
  # executed.

  - id: CONF-SCW-025
    requirement: [SNTR-DAUTH-011]
    profile: SNTR-SC1-WSS-V1
    roles: [client, server]
    capabilities: []
    mandatory: true
    preconditions: [transport_connected, designated_authority_fixture]
    input:
      transport:
        action: sc1_enrollment_attempt
        authority_paths: [authorized_bootstrap]
        denied_variants: [anonymous, unauthenticated_enroller]
        target_principal: principal-a
        scope: fixture-endpoint/scope
    expected:
      connection_state: CLOSED
      session_state: none
      error: { code: UNAUTHENTICATED }
      hygiene: { absent_from: [credential, token] }
    notes: "SC1-handshake-carried enrollment denials, one fixture run per variant: anonymous and unauthenticated enrollers are denied before any material is issued, staged or durably recorded (PLAN-DAUTH-011 negatives); zero durable records, zero protected effects, and the device retains no state that later authenticates. UNAUTHENTICATED applies to these authentication failures; valid-but-unauthorized credentials are the distinct rows below. Authorized-path validation with a bounded audit trail is the PLAN-DAUTH-011 success row; the equivalent out-of-band path is CONF-SCW-039."

  - id: CONF-SCW-026
    requirement: [SNTR-DAUTH-012]
    profile: SNTR-SC1-WSS-V1
    roles: [client, server]
    capabilities: []
    mandatory: true
    preconditions: [transport_connected, designated_authority_fixture, fault_injection]
    input:
      transport:
        action: sc1_issuance_faults
        inject: [entropy_failure, degenerate_zero_ak, forced_handle_collision, duplicate_live_tuple, concurrent_duplicate_issuance]
        handle_bytes: 8
        ak_bytes: 32
    expected:
      connection_state: CLOSED
      session_state: none
      error: { code: UNAUTHENTICATED }
      hygiene: { absent_from: [credential, token, "PRIVATE KEY"] }
    notes: "PLAN-DAUTH-012 negatives: entropy failure aborts before any staged record; degenerate AKs, collisions, duplicate and concurrent issuance are refused with no overwrite, no adoption of another principal's record, no second authorization for a live (handle, epoch) tuple and no post-issuance key substitution. Statistical samples never prove entropy quality (SNTR-SC-005)."

  - id: CONF-SCW-027
    requirement: [SNTR-DAUTH-013]
    profile: SNTR-SC1-WSS-V1
    roles: [client, server]
    capabilities: []
    mandatory: true
    preconditions: [transport_connected, designated_authority_fixture]
    input:
      transport:
        action: sc1_staged_enrollment
        steps: [stage, encrypted_deliver, device_persist_ack, durable_commit]
        activation_timeout: fixture_declared
    expected:
      connection_state: ACTIVE
      session_state: active
      transport: { authorization_after_commit: true, precommit_denied: true }
    notes: "PLAN-DAUTH-013 success row: authorization materializes only at durable commit; a staged, undelivered or unacknowledged record satisfies no returning-device validation, presents no valid enrollment to admission and authorizes no protected effect; delivery never conveys or re-echoes AK material through an unverified channel, URL or error path (§8.1 fault matrix F9)."

  - id: CONF-SCW-028
    requirement: [SNTR-DAUTH-014]
    profile: SNTR-SC1-WSS-V1
    roles: [client, server]
    capabilities: []
    mandatory: true
    preconditions: [transport_connected, designated_authority_fixture, fault_injection, injectable_clocks]
    input:
      transport:
        action: sc1_retry_idempotency
        crash_after: every_commit_boundary
        response_treatment: [withheld, duplicated]
        activation_timeout: expired_never_committed
    expected:
      connection_state: ACTIVE
      session_state: active
      transport: { authorized_enrollments_max: 1, double_issued_ak: false, resurrected_attempt: false }
    notes: "§8.1 fault matrix (F1–F9) per PLAN-DAUTH-014: crash, withhold and duplicate every boundary; at most one authorized enrollment, no unauthorized active record, no permanently inconsistent store; bounded timeout cleanup releases staged state so a later attempt re-provisions from scratch."

  - id: CONF-SCW-029
    requirement: [SNTR-DAUTH-015]
    profile: SNTR-SC1-WSS-V1
    roles: [client, server]
    capabilities: []
    mandatory: true
    preconditions: [transport_connected, valid_chain, designated_authority_fixture]
    input:
      transport:
        action: sc1_preready_negatives
        variants: [replayed_first_flight, missing_confirmation, stale_or_missing_enrollment, unverified_identity_claim, pre_ready_protected_request]
    expected:
      connection_state: CLOSED
      session_state: none
      error: { code: UNAVAILABLE }
      hygiene: { absent_from: [credential, token] }
    notes: "Accepted order (verify → confirmation+ClientHello → current enrollment/trusted identity/same-principal policy → ServerReady → authorized dispatch) is normative (RFC 0010 §3.4). Each skipped or reordered step yields no ServerReady principal, no dispatch and no queued early effects (PLAN-DAUTH-015 negatives). AK possession alone is not method authorization; any credential-less returning-device policy must be explicitly authenticated first."

  - id: CONF-SCW-030
    requirement: [SNTR-DAUTH-016]
    profile: SNTR-SC1-WSS-V1
    roles: [client, server]
    capabilities: []
    mandatory: true
    preconditions: [transport_connected, valid_chain, designated_authority_fixture]
    input:
      transport:
        action: sc1_binding_mismatch
        credentials: "fixture:sc1-principal"
        enrollment_principal: principal-a
        application_principal: [principal-b, principal-a-mismatch-reversed]
    expected:
      connection_state: CLOSED
      session_state: none
      error: { code: PERMISSION_DENIED }
      hygiene: { absent_from: [credential, token] }
    notes: "PLAN-DAUTH-016 negatives in both directions: application principal B against enrollment principal A (and the reverse) fails authorization before ready; the detecting host records the local PERMISSION_DENIED cause and the peer observes only the transport-native close signal (no privilege union, remapping or protected effect); correct binding passes with exactly the enrollment's privileges. Mid-connection rebinding is the distinct row below."

  - id: CONF-SCW-031
    requirement: [SNTR-DAUTH-017]
    profile: SNTR-SC1-WSS-V1
    roles: [client, server]
    capabilities: []
    mandatory: true
    preconditions: [transport_connected, designated_authority_fixture, revoked_enrollment]
    input:
      transport:
        action: sc1_revoked_reconnect
        carriers: [3]
        echo_variants: [replayed_context_flights, alternate_development_carrier, stale_store_state]
    expected:
      connection_state: CLOSED
      session_state: none
      error: { code: UNAUTHENTICATED }
      hygiene: { absent_from: [credential, token] }
    notes: "PLAN-DAUTH-017: revoked and expired enrollments are denied at admission and again before ready on every newly established connection, regardless of earlier validity, cryptographic handshake success or cached decisions; a revoked tuple never re-materializes as admissible (timing budgets are §8.3 B1)."

  - id: CONF-SCW-032
    requirement: [SNTR-DAUTH-018]
    profile: SNTR-SC1-WSS-V1
    roles: [client, server]
    capabilities: []
    mandatory: true
    preconditions: [transport_connected, active_session, designated_authority_fixture, injectable_clocks]
    input:
      transport:
        action: sc1_propagation_latency
        hard_maximum_s: 300
        operational_target_s: 60
        anchor: authoritative_revocation_commit
        post_deadline: { deny_protected_ops: true, delivery_cutoff: true, close_channel: true }
    expected:
      connection_state: CLOSED
      session_state: terminated_abnormally
      error: { code: UNAVAILABLE }
    notes: "PLAN-DAUTH-018 with §8.3 B2/B3/B6: observed commit-to-enforcement latency within the 300-second hard profile maximum, 60-second operational target preferred via push invalidation; a configured watchdog interval never substitutes for observed enforcement latency (§8.3 budgets). Longer grace beyond 300 s is NOT permitted under the default public production profile."

  - id: CONF-SCW-033
    requirement: [SNTR-DAUTH-019]
    profile: SNTR-SC1-WSS-V1
    roles: [client, server]
    capabilities: []
    mandatory: true
    preconditions: [transport_connected, active_session, designated_authority_fixture, fault_injection]
    input:
      transport:
        action: sc1_validity_unavailable
        profiles: [store_read_failure, store_read_timeout, cache_beyond_declared_bound, unresolved_revocation_state]
    expected:
      connection_state: CLOSED
      session_state: terminated_abnormally
      error: { code: UNAVAILABLE }
    notes: "PLAN-DAUTH-019 with §8.3 B5: no new admission and no cached-allow extension beyond the last successful validity check plus the deployment's declared freshness bound; an established channel whose binding cannot be re-validated closes within the declared bound, inside the 300-second profile maximum. Store unavailability degrades availability, never authorization integrity."

  - id: CONF-SCW-034
    requirement: [SNTR-DAUTH-020]
    profile: SNTR-SC1-WSS-V1
    roles: [client, server]
    capabilities: []
    mandatory: true
    preconditions: [transport_connected, designated_authority_fixture, fault_injection, injectable_clocks]
    input:
      transport:
        action: sc1_rotation_transaction
        replacement: { fresh_ak: true, fresh_handle: true, strictly_increasing_epoch: true, staged_transaction: true }
        crash_points: [replacement_stage, replacement_delivery, device_install, host_commit]
        races: [concurrent_reconnects, overlap_expiry, lost_ack_after_install]
        overlap_window: fixture_declared
    expected:
      connection_state: ACTIVE
      session_state: active
      transport: { install_before_retirement: true, cutoff_honored: true, old_credential_usable_at_or_after_cutoff: false }
    notes: "PLAN-DAUTH-020 with §8.2 matrix: replacement becomes sole authorized credential set after durable install and durable commit; revocation, expiry, compromise response and the hard cutoff never wait for installation or acknowledgment; a lost acknowledgment reconciles within the declared window or defaults to the cutoff without resurrecting the old credential."

  - id: CONF-SCW-035
    requirement: [SNTR-DAUTH-021]
    profile: SNTR-SC1-WSS-V1
    roles: [client, server]
    capabilities: []
    mandatory: true
    preconditions: [transport_connected, designated_authority_fixture, fault_injection, injectable_clocks]
    input:
      transport:
        action: sc1_epoch_integrity
        attempts: [lower_epoch, equal_epoch, pre_revocation_rollback, pre_rotation_rollback, epoch_exhaustion, stale_epoch_return]
        epoch_bytes: 8
    expected:
      connection_state: CLOSED
      session_state: none
      error: { code: UNAUTHENTICATED }
    notes: "PLAN-DAUTH-021 with §8.2 R8/R9/R10/R11: no epoch wraps, rewinds, reuses or revives; revoked and retired epochs stay invalid; concurrent reconnects settle against the durable epoch at that moment (inside the live overlap window or denied after the cutoff, never hybrid); a returning stale-epoch device is denied once its overlap lapsed. Success-path rotation is CONF-SCW-034."

  - id: CONF-SCW-036
    requirement: [SNTR-DAUTH-022]
    profile: SNTR-SC1-WSS-V1
    roles: [client, server]
    capabilities: []
    mandatory: true
    preconditions: [transport_connected, designated_authority_fixture, compromised_credential_fixture]
    input:
      transport:
        action: sc1_compromise_recovery
        replayed_material: [compromised_ak, revoked_credential, compromised_device_state]
        recovery_authority: independently_verified_designated_path
        replacement: { fresh_handle: true, fresh_epoch: true }
    expected:
      connection_state: CLOSED
      session_state: none
      error: { code: UNAUTHENTICATED }
      hygiene: { absent_from: [credential, token] }
    notes: "PLAN-DAUTH-022: universal denial except through the independently verified designated authority; a compromised or revoked credential never re-issues, extends its own validity or epoch, authorizes the recovery channel or supplies trust evidence for its replacement; recovery never relies on possession of the compromised secret or device state. Recovery is not claimable unless the deployment designates the path."

  - id: CONF-SCW-037
    requirement: [SNTR-DAUTH-023]
    profile: SNTR-SC1-WSS-V1
    roles: [client, server]
    capabilities: []
    mandatory: true
    preconditions: [transport_connected, designated_authority_fixture, synthetic_marker_instrumentation]
    input:
      transport:
        action: sc1_disposal_hygiene
        lifecycle_points: [expiry, retirement, revocation, transaction_timeout]
        surfaces_inspected: [logs, traces, metrics, error_text, durable_telemetry, store_backups]
        marker: synthetic_ak_marker
    expected:
      connection_state: CLOSED
      session_state: none
      hygiene: { absent_from: [synthetic_ak_marker, credential, token] }
    notes: "PLAN-DAUTH-023 (extends PLAN-DAUTH-004): disposal at every lifecycle point leaves no recoverable copy outside the documented boundary; synthetic markers are absent from logs, traces, metrics, errors and durable telemetry; authorization-store backups stay a documented secret boundary and fail the case rather than restore access when copied outside it. Access control and backup restriction are host-owned per SNTR-DAUTH-004; the runner inspects, it does not prove disposal assurance."

  - id: CONF-SCW-038
    requirement: [SNTR-DAUTH-024]
    profile: SNTR-SC1-WSS-V1
    roles: [client, server]
    capabilities: []
    mandatory: true
    preconditions: [transport_connected, valid_chain, trusted_pin_fixture]
    input:
      transport:
        action: sc1_pin_rotation
        tls_chain: valid_known_trusted_pin
        chain_validation: succeeds_before_update_processing
        attempts: [peer_taught_update, unauthenticated_channel_update, stale_configuration, replayed_configuration, retired_pin_reuse]
        one_invalid_update_per_run: true
        trusted_update: independently_authenticated_channel
    expected:
      connection_state: CLOSED
      session_state: none
      error: { code: UNAVAILABLE }
      hygiene: { absent_from: [credential, token] }
    notes: "PLAN-DAUTH-024: peer-taught, stale and replayed pin substitutions are refused; a retired pin's identity never becomes usable again; the connecting peer cannot teach the initiator a trust anchor. Trusted rotation through a bounded pin set on an independently authenticated channel is the PLAN-DAUTH-024 success row; store format and distribution remain host-owned per RFC 0007 §11.2."

  - id: CONF-SCW-039
    requirement: [SNTR-DAUTH-011]
