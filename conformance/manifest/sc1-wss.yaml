    notes: "Equivalent out-of-band enrollment-path check with no SC1 handshake, so transport-closure keys are asserted only where an SC1 fixture actually runs: the designated authority gates issuance on enroller identity, target principal and scope, and denied attempts (PLAN-DAUTH-011 negatives) leave no durable record, no device state that later authenticates and no protected effect. The authorized out-of-band enrollment success is the PLAN-DAUTH-011 success row."
