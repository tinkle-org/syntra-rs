    expected:
      connection_state: CLOSED
      session_state: none
      transport: { status: 415 }
    notes: "Invalid media type (missing/octet-stream/suffixed rows): 415 before body parsing in all three."

  - id: CONF-HTTP-006
    requirement: [SNTR-HTTP-020, SNTR-HTTP-021, SNTR-SER-007]
    profile: SNTR-HTTP-V1
    roles: [client, server]
    capabilities: []
    mandatory: true
    preconditions: [transport_connected]
    input:
      transport: { action: http_request, method: POST, path: "/syntra/v1/rpc", headers: { content_type: "application/vnd.syntra.v1+protobuf" }, body_hex: "ff" }
    expected:
      connection_state: CLOSED
      session_state: none
      transport: { status: 400 }
    notes: "Malformed body (truncated varint / non-request variant / trailing-bytes rows): 400, no dispatch, no panic, no unbounded allocation."

  - id: CONF-HTTP-007
    requirement: [SNTR-HTTP-110, SNTR-HTTP-111, SNTR-WIRE-006]
    profile: SNTR-HTTP-V1
    roles: [client, server]
    capabilities: []
    mandatory: true
    preconditions: [transport_connected]
    input:
      transport: { action: http_request, method: POST, path: "/syntra/v1/rpc", headers: { content_length: 1048577 } }
    expected:
      connection_state: CLOSED
      session_state: none
      transport: { status: 413 }
    notes: "Oversized body (MAX+1 declared and chunked-streaming rows): 413; server MUST NOT read the declared body; exactly-MAX boundary accepted."

  - id: CONF-HTTP-008
    requirement: [SNTR-HTTP-030, SNTR-HTTP-031]
    profile: SNTR-HTTP-V1
    roles: [client, server]
    capabilities: []
    mandatory: true
    preconditions: [transport_connected]
    input:
      transport: { action: http_request, method: POST, path: "/syntra/v1/rpc", headers: { syntra_min_version: 2, syntra_max_version: 3 }, body_ref: "http/V-HTTP-REQ-01" }
    expected:
      connection_state: CLOSED
      session_state: none
      transport: { status: 400, result_envelope: absent, local_report: INVALID_ARGUMENT }
    notes: "Version mismatch/bad headers (disjoint, inverted, missing, envelope-disagree rows): 400 without credential evaluation or dispatch; no Syntra result envelope (handshake.md §5 HTTP/HTTPS no-overlap row). The initiator's adapter reports the local binding failure INVALID_ARGUMENT per SNTR-HTTP-041 and MUST NOT infer the host's precise typed cause (RFC 0003 D1: HTTP synthesizes the handshake from headers, not a wire hello Frame); this is the HTTP-profile counterpart to CONF-CORE-005."

  - id: CONF-HTTP-009
    requirement: [SNTR-HTTP-060, SNTR-HTTP-061, SNTR-HTTP-064]
    profile: SNTR-HTTP-V1
    roles: [client, server]
    capabilities: []
    mandatory: true
    preconditions: [transport_connected]
    input:
      transport: { action: http_request, method: POST, path: "/syntra/v1/rpc", headers: {}, body_ref: "http/V-HTTP-REQ-01" }
    expected:
      connection_state: CLOSED
      session_state: none
      transport: { status: 401 }
    notes: "Missing credential row (anonymous sub-runs): accept-anonymous hosts bind least-privilege for that exchange only; deny-anonymous hosts 401 with WWW-Authenticate. Both rows run."

  - id: CONF-HTTP-010
    requirement: [SNTR-HTTP-060, SNTR-HTTP-062, SNTR-HTTP-063]
    profile: SNTR-HTTP-V1
    roles: [client, server]
    capabilities: []
    mandatory: true
    preconditions: [transport_connected]
    input:
