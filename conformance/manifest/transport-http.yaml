# Portable HTTP/1.1 cases (Section I/HTTP). Profile: SNTR-HTTP-V1. All Mandatory.
# Prose companion: conformance/requirements/http.md (CONF-HTTP-001…018).
# Development-only profile. Every envelope assertion MUST hold as equal decoded logical Frames
# over HTTPS/H1 per SNTR-WIRE-901.
format_version: "1.0"
profile: SNTR-HTTP-V1
cases:
  - id: CONF-HTTP-001
    requirement: [SNTR-HTTP-001, SNTR-HTTP-010, SNTR-HTTP-020, SNTR-HTTP-030]
    profile: SNTR-HTTP-V1
    roles: [client, server]
    capabilities: []
    mandatory: true
    preconditions: [transport_connected]
    input:
      transport: { action: http_request, method: POST, path: "/syntra/v1/rpc", headers: { content_type: "application/vnd.syntra.v1+protobuf" }, body_ref: "http/V-HTTP-REQ-01" }
      credentials: "fixture:opaque-valid-A"
    expected:
      connection_state: CLOSED
      session_state: none
      transport: { status: 200, content_type: "application/vnd.syntra.v1+protobuf", body_ref: "http/V-HTTP-RES-OK-01" }
    notes: "Valid request: one envelope in, one envelope out; per-request independence; no Syntra state retained."

  - id: CONF-HTTP-002
    requirement: [SNTR-HTTP-002]
    profile: SNTR-HTTP-V1
    roles: [client, server]
    capabilities: []
    mandatory: true
    preconditions: [transport_connected]
    input:
      transport: { action: http_request, method: GET, path: "/syntra/v1/rpc" }
    expected:
      connection_state: CLOSED
      session_state: none
      transport: { status: 405, allow: POST }
    notes: "Invalid method (GET/PUT/OPTIONS-without-deployment rows): 405 with Allow: POST; empty-or-ignored body; no dispatch. PUT and OPTIONS rows repeat."

  - id: CONF-HTTP-003
    requirement: [SNTR-HTTP-002]
    profile: SNTR-HTTP-V1
    roles: [client, server]
    capabilities: []
    mandatory: true
    preconditions: [transport_connected]
    input:
      transport: { action: http_request, method: POST, path: "/syntra/v1/rpc/" }
    expected:
      connection_state: CLOSED
      session_state: none
      transport: { status: 404 }
    notes: "Wrong path/trailing slash: /rpc2, case-variant, and trailing-slash rows all 404 with no normalization and no dispatch."

  - id: CONF-HTTP-004
    requirement: [SNTR-HTTP-003, SNTR-HTTP-005]
    profile: SNTR-HTTP-V1
    roles: [client, server]
    capabilities: []
    mandatory: true
    preconditions: [transport_connected]
    input:
      transport: { action: http_request, method: POST, path: "/syntra/v1/rpc?credential=AAAA" }
    expected:
      connection_state: CLOSED
      session_state: none
      transport: { status: 400 }
      hygiene: { absent_from: ["AAAA"] }
    notes: "Query rejection: 400, no dispatch, query material never logged as credential."

  - id: CONF-HTTP-005
    requirement: [SNTR-HTTP-011]
