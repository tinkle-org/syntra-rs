    expected:
      connection_state: CLOSED
      session_state: none
      transport: { status: 401 }
      hygiene: { absent_from: [credential, token] }
    notes: "Invalid/malformed/expired credential (unknown-opaque, foreign-scheme, bad-base64, expired, revoked rows): 401 with WWW-Authenticate and generic text in all five."

  - id: CONF-HTTP-011
    requirement: [SNTR-HTTP-040, SNTR-HTTP-041]
    profile: SNTR-HTTP-V1
    roles: [client, server]
    capabilities: []
    mandatory: true
    preconditions: [transport_connected]
    input:
      transport: { action: http_request, method: POST, path: "/syntra/v1/rpc", headers: { content_type: "application/vnd.syntra.v1+protobuf" }, body_ref: "http/V-HTTP-REQ-UNKNOWN-METHOD" }
      credentials: "fixture:opaque-valid-A"
    expected:
      connection_state: CLOSED
      session_state: none
      transport: { status: 200, body_ref: "http/V-HTTP-RES-ERR-01" }
    notes: "Normal RpcError over 200: unknown-method/unauthorized/deadline rows all 200 with result{error{...}} bodies; 4xx/5xx never carry handler verdicts; 500 never appears."

  - id: CONF-HTTP-012
    requirement: [SNTR-HTTP-040, SNTR-HTTP-042, SNTR-HTTP-043]
    profile: SNTR-HTTP-V1
    roles: [client, server]
    capabilities: []
    mandatory: true
    preconditions: [transport_connected]
    input:
      transport: { action: force_each_binding_status, statuses: [400, 401, 404, 405, 413, 415, 429, 503] }
      faults: { corrupt_200_body: true }
    expected:
      connection_state: CLOSED
      session_state: none
      transport: { synthesized_result: false }
    notes: "Binding-status layering: every non-200 and the corrupted-200 report a local transport failure (UNAVAILABLE for corruption — unknown outcome, never success); the initiator synthesizes NO RpcResult."

  - id: CONF-HTTP-013
    requirement: [SNTR-HTTP-070, SNTR-HTTP-071, SNTR-HTTP-072]
    profile: SNTR-HTTP-V1
    roles: [client, server]
    capabilities: []
    mandatory: true
    preconditions: [transport_connected]
    input:
      transport:
        action: sixteen_concurrent_exchanges
        method: "/example.Echo/Echo"
        exchanges:
          - { request_id: 21, payload_b64: "cnBjLXAyMQ==", credentials: "fixture:opaque-valid-A" }
          - { request_id: 22, payload_b64: "cnBjLXAyMg==", credentials: "fixture:opaque-valid-B" }
          - { request_id: 23, payload_b64: "cnBjLXAyMw==", credentials: "fixture:opaque-valid-A" }
          - { request_id: 24, payload_b64: "cnBjLXAyNA==", credentials: "fixture:opaque-valid-B" }
          - { request_id: 25, payload_b64: "cnBjLXAyNQ==", credentials: "fixture:opaque-valid-A" }
          - { request_id: 26, payload_b64: "cnBjLXAyNg==", credentials: "fixture:opaque-valid-B" }
          - { request_id: 27, payload_b64: "cnBjLXAyNw==", credentials: "fixture:opaque-valid-A" }
          - { request_id: 28, payload_b64: "cnBjLXAyOA==", credentials: "fixture:opaque-valid-B" }
          - { request_id: 29, payload_b64: "cnBjLXAyOQ==", credentials: "fixture:opaque-valid-A" }
          - { request_id: 30, payload_b64: "cnBjLXAzMA==", credentials: "fixture:opaque-valid-B" }
          - { request_id: 31, payload_b64: "cnBjLXAzMQ==", credentials: "fixture:opaque-valid-A" }
          - { request_id: 32, payload_b64: "cnBjLXAzMg==", credentials: "fixture:opaque-valid-B" }
          - { request_id: 33, payload_b64: "cnBjLXAzMw==", credentials: "fixture:opaque-valid-A" }
          - { request_id: 34, payload_b64: "cnBjLXAzNA==", credentials: "fixture:opaque-valid-B" }
          - { request_id: 35, payload_b64: "cnBjLXAzNQ==", credentials: "fixture:opaque-valid-A" }
          - { request_id: 36, payload_b64: "cnBjLXAzNg==", credentials: "fixture:opaque-valid-B" }
        sequential_exchanges:
          - { request_id: 21, payload_b64: "cnBjLXAzNw==", credentials: "fixture:opaque-valid-C" }
        pipelined_exchanges:
          - { request_id: 41, payload_b64: "cnBjLXA0MQ==", credentials: "fixture:opaque-valid-A" }
          - { request_id: 42, payload_b64: "cnBjLXA0Mg==", credentials: "fixture:opaque-valid-B" }
          - { request_id: 43, payload_b64: "cnBjLXA0Mw==", credentials: "fixture:opaque-valid-A" }
          - { request_id: 44, payload_b64: "cnBjLXA0NA==", credentials: "fixture:opaque-valid-B" }
      faults: { reverse_completion_order: { barrier: all_admitted } }
    expected:
      connection_state: CLOSED
      session_state: none
      frames:
        - { request_id: 36, body: result, payload_b64: "cnBjLXAzNg==" }
        - { request_id: 35, body: result, payload_b64: "cnBjLXAzNQ==" }
        - { request_id: 34, body: result, payload_b64: "cnBjLXAzNA==" }
        - { request_id: 33, body: result, payload_b64: "cnBjLXAzMw==" }
        - { request_id: 32, body: result, payload_b64: "cnBjLXAzMg==" }
        - { request_id: 31, body: result, payload_b64: "cnBjLXAzMQ==" }
        - { request_id: 30, body: result, payload_b64: "cnBjLXAzMA==" }
        - { request_id: 29, body: result, payload_b64: "cnBjLXAyOQ==" }
        - { request_id: 28, body: result, payload_b64: "cnBjLXAyOA==" }
        - { request_id: 27, body: result, payload_b64: "cnBjLXAyNw==" }
        - { request_id: 26, body: result, payload_b64: "cnBjLXAyNg==" }
        - { request_id: 25, body: result, payload_b64: "cnBjLXAyNQ==" }
        - { request_id: 24, body: result, payload_b64: "cnBjLXAyNA==" }
        - { request_id: 23, body: result, payload_b64: "cnBjLXAyMw==" }
        - { request_id: 22, body: result, payload_b64: "cnBjLXAyMg==" }
        - { request_id: 21, body: result, payload_b64: "cnBjLXAyMQ==" }
        - { request_id: 21, body: result, payload_b64: "cnBjLXAzNw==" }
        - { request_id: 41, body: result, payload_b64: "cnBjLXA0MQ==" }
        - { request_id: 42, body: result, payload_b64: "cnBjLXA0Mg==" }
        - { request_id: 43, body: result, payload_b64: "cnBjLXA0Mw==" }
        - { request_id: 44, body: result, payload_b64: "cnBjLXA0NA==" }
    notes: "Concurrency floor (SNTR-HTTP-072) over the per-exchange binding: 16 SIMULTANEOUSLY outstanding exchanges against one listener endpoint group, each on its own pooled connection (no pipelining on a shared connection, whose response order would be forced by HTTP/1.1 semantics; pipelining is covered by the separate pipelining sub-case below). Each exchange stays one complete, independent logical Syntra connection (SNTR-HTTP-070; RFC 0004 D3) — carrying sixteen concurrent RPCs never requires an HTTP exchange to be a multiplexed Syntra connection; it requires the listener's per-endpoint capacity, which this fixture proves directly. Keep-alive/pipelining MUST NOT merge Syntra state across exchanges (SNTR-HTTP-071): a pipelining sub-case (structured `pipelined_exchanges`: ids 41–44 with distinct payloads rpc-p41..rpc-p44 and per-exchange credentials fixture A/B/A/B, run LAST after the sequencing sub-case, all four requests pipelined on ONE keep-alive connection) asserts per-exchange correlation — each response under its echoed request_id carrying its own payload bit-exactly (the `expected.frames` tail, in pipelined request order) — with no merged state and with credentials re-presented per exchange on that shared connection (connection reuse implies no principal; SNTR-HTTP-071), WITHOUT requiring reversed completion (pipelined HTTP/1.1 responses return in request order, which SNTR-HTTP-072's ordering-none rule does not forbid). Deterministic harness coordination with the documented reverse-completion fault shape: the harness admits ALL 16 exchanges (barrier: all_admitted) before releasing ANY terminal outcome, then releases results in strictly descending request_id order (SNTR-HTTP-072 ordering: none); the initiator correlates solely by echoed request_id and MUST NOT assume FIFO. Each concurrent exchange carries a DISTINCT opaque payload (rpc-p21..rpc-p36; the reused-ID sequential exchange carries rpc-p37), and each result must carry its own exchange's payload bit-exactly under the same echoed request_id (identical-echo assertion, `expected.frames` in CONF-RPC-013's format; results in required completion order — descending, then the sequential exchange, then the pipelined sub-case's four responses in request order) — a response under a wrong echoed request_id fails the fixture even in setups that ignore payload contents. Every exchange row (concurrent, sequential, pipelined) declares its own `credentials` fixture explicitly (A/B alternating across the concurrent batch; C on the reused-ID sequential exchange; A/B across the pipelined sub-case) — no case-level default, no implicit runner injection. Each corresponding expected result row carries only the emitted `result` Frame's own keys (`request_id`, `body`, `payload_b64`): `syntra.v1.Frame` has no credentials field, and `expected.frames` lists emitted Syntra Frames only (manifest README, expected.frames entries) — the harness associates each result with its originating exchange by the echoed `request_id`, and the distinct per-exchange payload asserted bit-exactly under that ID (identical-echo) is what proves response-to-exchange association. A payload echo alone does not identify the credential subject: the fixture still fails a response delivered under a wrong echoed request_id, but asserting which principal each exchange's handler actually bound — per-exchange credential isolation as subject binding — requires a principal-sensitive authorization assertion this case does not provide; nothing here relaxes SNTR-HTTP-071's host prohibitions (no principal caching keyed by connection), and exchange-level credential evaluation (missing/invalid → 401) stays with CONF-HTTP-009/CONF-HTTP-010. Sequencing sub-case (structured `sequential_exchanges`, run after all 16 complete): a subsequent sequential exchange REUSING id=21 is a new, unrelated correlation (SNTR-HTTP-073; no cross-exchange duplicate rejection, shared high-water state, or cross-exchange request-ID memory). Excess beyond the host's documented maximum rejects pre-dispatch with 429 or post-acceptance with 200 + RESOURCE_EXHAUSTED per SNTR-RPC-008's mapping (admission-control rows)."

  - id: CONF-HTTP-014
    requirement: [SNTR-HTTP-080, SNTR-HTTP-081, SNTR-HTTP-082]
    profile: SNTR-HTTP-V1
    roles: [client, server]
    capabilities: []
    mandatory: true
    preconditions: [transport_connected]
    input:
      transport: { action: loss_then_retry_same_opkey, opkey_b64: "b3AtQUJD" }
    expected: { connection_state: CLOSED, session_state: none }
    notes: "Retry/idempotency discipline: same op-key bytes bit-exact on retry; server matches its documented dedup policy; 503 retried, 400 corrected as a new decision, identical-401 never tight-looped."

  - id: CONF-HTTP-015
    requirement: [SNTR-HTTP-090, SNTR-HTTP-100]
    profile: SNTR-HTTP-V1
    roles: [client, server]
    capabilities: []
    mandatory: true
    preconditions: [transport_connected]
    input:
      transport: { action: redirect_and_cache_probe }
    expected: { connection_state: CLOSED, session_state: none }
    notes: "Redirect non-following + cache discipline: 307 terminates with UNAVAILABLE without re-sending; Cache-Control: no-store both directions; no ETag/304."

  - id: CONF-HTTP-016
    requirement: [SNTR-HTTP-120, SNTR-HTTP-121]
    profile: SNTR-HTTP-V1
    roles: [client, server]
    capabilities: []
    mandatory: true
    preconditions: [transport_connected]
    input:
      transport: { action: compression_probe }
    expected:
      connection_state: CLOSED
      session_state: none
      transport: { status: 415 }
    notes: "Compression rejected by default: Content-Encoding: gzip yields 415; no Content-Encoding on responses; documented-compression deployments instead pass the capped-bomb (decompressed past bound -> 413) row."

  - id: CONF-HTTP-017
    requirement: [SNTR-HTTP-130, SNTR-HTTP-131]
    profile: SNTR-HTTP-V1
    roles: [client, server]
    capabilities: []
    mandatory: true
    preconditions: [transport_connected]
    input:
      transport: { action: upgrade_and_push_probe }
    expected:
      connection_state: CLOSED
      session_state: none
      transport: { status: 400 }
    notes: "No event push: Upgrade: websocket refused with 400; exactly one response per request — no Notification, SSE, or second response. Polling-via-RPC is an ordinary second exchange."

  - id: CONF-HTTP-018
    requirement: [SNTR-HTTP-140, SNTR-HTTP-141]
    profile: SNTR-HTTP-V1
    roles: [client, server]
    capabilities: []
    mandatory: true
    preconditions: [transport_connected]
    input:
      transport: { action: cors_probe, origin: "https://evil.example" }
    expected: { connection_state: CLOSED, session_state: none }
    notes: "CORS is policy, never authorization: no wildcard-with-credentials or off-list reflection; preflight only where documented; CORS headers alone authorize nothing (still 401/anonymous-per-policy)."
