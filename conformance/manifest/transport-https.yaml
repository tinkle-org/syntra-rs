# Portable HTTPS cases (Section I/HTTPS). Profiles: SNTR-HTTPS-H1-V1 + SNTR-HTTPS-H2-V1.
# Prose companion: conformance/requirements/https.md (CONF-HTTPS-001…014).
# Every envelope assertion reuses test-vectors/http fixtures; only framing differs between H1 and H2.
format_version: "1.0"
profile: [SNTR-HTTPS-H1-V1, SNTR-HTTPS-H2-V1]
cases:
  - id: CONF-HTTPS-001
    requirement: [SNTR-HTTPS-001, SNTR-HTTPS-010, SNTR-HTTPS-030]
    profile: SNTR-HTTPS-H1-V1
    roles: [client, server]
    capabilities: []
    mandatory: true
    preconditions: [no_transport, valid_chain]
    input:
      transport: { action: https_h1_exchange, alpn: "http/1.1", body_ref: "http/V-HTTP-REQ-01" }
      credentials: "fixture:opaque-valid-A"
    expected:
      connection_state: CLOSED
      session_state: none
      transport: { status: 200, body_ref: "http/V-HTTP-RES-OK-01" }
    notes: "HTTPS/H1 success: chain+hostname+expiry verified before any credential byte; harness asserts no credential preceded validation."

  - id: CONF-HTTPS-002
    requirement: [SNTR-HTTPS-001, SNTR-HTTPS-020, SNTR-HTTPS-040]
    profile: SNTR-HTTPS-H2-V1
    roles: [client, server]
    capabilities: []
    mandatory: true
    preconditions: [no_transport, valid_chain]
    input:
      transport: { action: https_h2_exchange, alpn: "h2", stream_id: 1, body_ref: "http/V-HTTP-REQ-01" }
      credentials: "fixture:opaque-valid-A"
    expected:
      connection_state: CLOSED
      session_state: none
      transport: { status: 200, body_ref: "http/V-HTTP-RES-OK-01" }
    notes: "HTTPS/H2 success: :method/:path/headers per fixtures; single response ends the stream; identical logical result to H1 (profile SNTR-HTTPS-H2-V1)."

  - id: CONF-HTTPS-003
    requirement: [SNTR-HTTPS-041, SNTR-HTTPS-042, SNTR-HTTPS-043]
    profile: SNTR-HTTPS-H2-V1
    roles: [client, server]
    capabilities: []
    mandatory: true
    preconditions: [no_transport, valid_chain]
    input:
      transport:
        action: https_h2_sixteen_concurrent_streams
        streams:
          - { id: 1, request_id: 21, payload_b64: "cnBjLXAyMQ==" }
          - { id: 3, request_id: 22, payload_b64: "cnBjLXAyMg==" }
          - { id: 5, request_id: 23, payload_b64: "cnBjLXAyMw==" }
          - { id: 7, request_id: 24, payload_b64: "cnBjLXAyNA==" }
          - { id: 9, request_id: 25, payload_b64: "cnBjLXAyNQ==" }
          - { id: 11, request_id: 26, payload_b64: "cnBjLXAyNg==" }
          - { id: 13, request_id: 27, payload_b64: "cnBjLXAyNw==" }
          - { id: 15, request_id: 28, payload_b64: "cnBjLXAyOA==" }
          - { id: 17, request_id: 29, payload_b64: "cnBjLXAyOQ==" }
          - { id: 19, request_id: 30, payload_b64: "cnBjLXAzMA==" }
          - { id: 21, request_id: 31, payload_b64: "cnBjLXAzMQ==" }
          - { id: 23, request_id: 32, payload_b64: "cnBjLXAzMg==" }
          - { id: 25, request_id: 33, payload_b64: "cnBjLXAzMw==" }
          - { id: 27, request_id: 34, payload_b64: "cnBjLXAzNA==" }
          - { id: 29, request_id: 35, payload_b64: "cnBjLXAzNQ==" }
          - { id: 31, request_id: 36, payload_b64: "cnBjLXAzNg==" }
      credentials: "fixture:opaque-valid-A"
      faults: { reverse_completion_order: { barrier: all_admitted } }
    expected:
      connection_state: CLOSED
      session_state: none
      frames:
        - { request_id: 36, body: result, payload_b64: "cnBjLXAzNg==" }
        - { request_id: 35, body: result, payload_b64: "cnBjLXAzNQ==" }
        - { request_id: 34, body: result, payload_b64: "cnBjLXAzNA==" }
        - { request_id: 33, body: result, payload_b64: "cnBjLXAzMw==" }
        - { request_id: 32, body: result, payload_b64: "cnBjLXAzMg==" }
        - { request_id: 31, body: result, payload_b64: "cnBjLXAzMQ==" }
        - { request_id: 30, body: result, payload_b64: "cnBjLXAzMA==" }
        - { request_id: 29, body: result, payload_b64: "cnBjLXAyOQ==" }
        - { request_id: 28, body: result, payload_b64: "cnBjLXAyOA==" }
        - { request_id: 27, body: result, payload_b64: "cnBjLXAyNw==" }
        - { request_id: 26, body: result, payload_b64: "cnBjLXAyNg==" }
        - { request_id: 25, body: result, payload_b64: "cnBjLXAyNQ==" }
        - { request_id: 24, body: result, payload_b64: "cnBjLXAyNA==" }
        - { request_id: 23, body: result, payload_b64: "cnBjLXAyMw==" }
        - { request_id: 22, body: result, payload_b64: "cnBjLXAyMg==" }
        - { request_id: 21, body: result, payload_b64: "cnBjLXAyMQ==" }
    notes: "Concurrency floor (SNTR-HTTPS-041): 16 SIMULTANEOUSLY outstanding H2 streams on ONE transport connection; each stream remains one independent logical Syntra connection/session (SNTR-HTTPS-043, http.md §1I), so this proves per-stream capacity without implying any multiplexed Syntra connection exists. Deterministic harness coordination with the documented reverse-completion fault shape: the harness admits ALL 16 streams (barrier: all_admitted) before releasing ANY terminal outcome, then releases results in strictly descending request_id order (SNTR-HTTPS-042 ordering: none across streams); the initiator correlates solely by echoed request_id and MUST NOT assume FIFO, stream-ID order, or priority order. Each stream carries a DISTINCT opaque payload (rpc-p21..rpc-p36) and its 200 envelope must carry its own stream's payload bit-exactly under the same echoed request_id (identical-echo assertion). H2 stream IDs NEVER appear in any Syntra field, and MUST NOT be logged alongside principal material (negative wire-trace check; SNTR-HTTPS-043, SNTR-ASEC-001/004). Excess beyond the host's documented maximum (SETTINGS_MAX_CONCURRENT_STREAMS plus application caps) rejects pre-dispatch with 429/503 or post-acceptance with 200 + RESOURCE_EXHAUSTED per SNTR-RPC-008's mapping."

  - id: CONF-HTTPS-004
    requirement: [SNTR-HTTPS-010, SNTR-HTTPS-011, SNTR-TSEC-003]
    profile: [SNTR-HTTPS-H1-V1, SNTR-HTTPS-H2-V1]
    roles: [client, server]
    capabilities: []
    mandatory: true
    preconditions: [no_transport, invalid_chain]
    input:
      transport: { action: tls_handshake, version: TLS1_3, pki: test-pki-untrusted }
    expected:
      connection_state: CLOSED
      session_state: none
      error: { code: UNAVAILABLE }
    notes: "Invalid chain (self-signed-untrusted / wrong-chain / malformed rows): TLS fails; no HTTP request and no credential bytes sent (packet-capture proof); no plaintext fallback."

  - id: CONF-HTTPS-005
    requirement: [SNTR-HTTPS-012, SNTR-TSEC-004]
    profile: [SNTR-HTTPS-H1-V1, SNTR-HTTPS-H2-V1]
    roles: [client, server]
    capabilities: []
    mandatory: true
    preconditions: [no_transport, wrong_hostname]
    input:
      transport: { action: tls_handshake, version: TLS1_3, pki: test-pki-wrong-san }
    expected: { connection_state: CLOSED, session_state: none }
    notes: "Wrong hostname + expired rows: rejection before credential presentation in both; chain-validity alone never suffices."

  - id: CONF-HTTPS-006
    requirement: [SNTR-HTTPS-010, SNTR-HTTPS-013, SNTR-TSEC-002, SNTR-TSEC-007]
    profile: [SNTR-HTTPS-H1-V1, SNTR-HTTPS-H2-V1]
    roles: [client, server]
    capabilities: []
    mandatory: true
    preconditions: [no_transport, weak_tls_only]
    input:
      transport: { action: tls_handshake, version: TLS1_2_only }
      faults: { observe_retry_after_failure: true }
    expected: { connection_state: CLOSED, session_state: none }
    notes: "TLS below 1.3 refused; no plaintext or weaker-version retry by the implementation — fail closed, credentials undisclosed."

  - id: CONF-HTTPS-007
    requirement: [SNTR-HTTPS-020, SNTR-HTTPS-021]
    profile: [SNTR-HTTPS-H1-V1, SNTR-HTTPS-H2-V1]
    roles: [client, server]
    capabilities: []
    mandatory: true
    preconditions: [no_transport, valid_chain]
    input:
      transport: { action: alpn_mismatch_probe }
    expected: { connection_state: CLOSED, session_state: none }
    notes: "ALPN mismatch fails closed (http/1.1-only vs h2-only rows plus non-TLS bytes on the TLS port); ALPN plays no auth role."

  - id: CONF-HTTPS-008
    requirement: [SNTR-HTTPS-014, SNTR-TSEC-006]
    profile: [SNTR-HTTPS-H1-V1, SNTR-HTTPS-H2-V1]
    roles: [client, server]
    capabilities: []
    mandatory: true
    preconditions: [no_transport, valid_chain]
    input:
      transport: { action: rotation_window_probe, pki: test-pki-rotation-overlap }
    expected: { connection_state: CLOSED, session_state: none }
    notes: "Rotation accepted; pinning absent: handshakes before/during/after rotation with currently valid chains succeed; no hard-coded-leaf rejection; no protocol version change."

  - id: CONF-HTTPS-009
    requirement: [SNTR-HTTPS-051, SNTR-HTTP-080, SNTR-HTTP-082]
    profile: SNTR-HTTPS-H2-V1
    roles: [client, server]
    capabilities: []
    mandatory: true
    preconditions: [no_transport, valid_chain]
    input:
      transport: { action: h2_reset_probe }
      credentials: "fixture:opaque-valid-A"
    expected:
      connection_state: CLOSED
      session_state: none
      error: { code: UNAVAILABLE }
    notes: "REFUSED_STREAM is safe (fresh stream MAY report definitely-not-executed and retry with fresh request_id + same op key); other mid-response resets are unknown-outcome UNAVAILABLE. The two MUST NOT be conflated."

  - id: CONF-HTTPS-010
    requirement: [SNTR-HTTPS-051]
    profile: SNTR-HTTPS-H2-V1
    roles: [client, server]
    capabilities: []
    mandatory: true
    preconditions: [no_transport, valid_chain]
    input:
      transport: { action: h2_goaway_probe }
      credentials: "fixture:opaque-valid-A"
    expected:
      connection_state: CLOSED
      session_state: none
      error: { code: UNAVAILABLE }
    notes: "GOAWAY drains: in-flight streams report UNAVAILABLE (unknown outcome); no new streams on the draining connection; reconnect uses fresh streams/IDs/repeated op keys."

  - id: CONF-HTTPS-011
    requirement: [SNTR-HTTPS-060, SNTR-TSEC-008]
    profile: [SNTR-HTTPS-H1-V1, SNTR-HTTPS-H2-V1]
    roles: [client, server]
    capabilities: []
    mandatory: true
    preconditions: [no_transport, valid_chain]
    input:
      transport: { action: proxy_mismatch_probe }
    expected: { connection_state: CLOSED, session_state: none }
    notes: "Proxy/termination mismatch rejected (insecure backend leg, SNI/:authority mismatch rows fail); X-Forwarded-* headers ignored for auth (per-request Authorization alone decides)."

  - id: CONF-HTTPS-012
    requirement: [SNTR-HTTPS-045, SNTR-HTTPS-070, SNTR-HTTP-130]
    profile: SNTR-HTTPS-H2-V1
    roles: [client, server]
    capabilities: []
    mandatory: true
    preconditions: [no_transport, valid_chain]
    input:
      transport: { action: push_and_cross_profile_probe }
      credentials: "fixture:opaque-valid-A"
    expected: { connection_state: CLOSED, session_state: none }
    notes: "Push refused (PUSH_PROMISE -> RST_STREAM, nothing parsed as Frame/event); cross-profile continuity (H1 context on H2 and vice versa) rejected as unnegotiated resumption."

  - id: CONF-HTTPS-013
    requirement: [SNTR-HTTPS-052, SNTR-HTTP-040, SNTR-HTTP-042]
    profile: SNTR-HTTPS-H2-V1
    roles: [client, server]
    capabilities: []
    mandatory: true
    preconditions: [no_transport, valid_chain]
    input:
      transport: { action: h2_layering_probe }
      credentials: "fixture:opaque-valid-A"
    expected:
      connection_state: CLOSED
      session_state: none
      transport: { synthesized_result: false }
    notes: "Response-authenticated layering holds on H2: unknown-method RPC stays :status 200 + result{error{UNIMPLEMENTED}}; bad :path stays 404 with no envelope; bit-flipped 200 discarded as UNAVAILABLE, never success."

  - id: CONF-HTTPS-014
    requirement: [SNTR-HTTPS-031, SNTR-HTTPS-043, SNTR-HTTP-064, SNTR-HTTP-071]
    profile: [SNTR-HTTPS-H1-V1, SNTR-HTTPS-H2-V1]
    roles: [client, server]
    capabilities: []
    mandatory: true
    preconditions: [no_transport, valid_chain]
    input:
      transport: { action: per_stream_auth_isolation_probe }
    expected: { connection_state: CLOSED, session_state: none }
    notes: "Per-stream/exchange auth isolation: streams/exchanges with P, Q, and no credential evaluated independently; TLS/connection reuse implies no principal and no session."
