# Syntra v1 conformance profiles (machine-readable)
# Companion to conformance/README.md §2. Kinds: MANDATORY_CORE | OPTIONAL_CAPABILITY | TRANSPORT_PROFILE.
# An implementation claims Core by passing its selected core/session/RPC/security/event cases
# over at least one transport profile; each extra transport/capability is claimed independently.
# RFC 0007 is accepted. SNTR-SC1-WSS-V1 is the registered SC1/WSS profile; its
# cases are executable specifications, not execution results. Baseline WSS keeps
# its own profile and frame mapping. RFC 0006 is accepted with its §11 decision
# amendment authoritative; recovery stays capability-gated under
# syntra.update-recovery/1 and its registered cases remain unexecuted (see the
# SNTR-EVENTS-V1 profile notes).
format_version: "1.0"
syntra_version: "v1"
profiles:
  - id: SNTR-CORE-V1
    kind: MANDATORY_CORE
    title: "Syntra Core v1 — envelope, serialization, handshake, RPC, errors, auth interface, bounds, security, event optionality"
    required_for: "every conformance claim"
    secure_transport_required_for_production: true
    requirement_families: [SNTR-CORE, SNTR-SER, SNTR-WIRE, SNTR-HS, SNTR-RPC, SNTR-ERR, SNTR-AUTH, SNTR-VER, SNTR-CAP, SNTR-REL, SNTR-STEST, SNTR-EVENT]
    manifests:
      - manifest/core.yaml
      - manifest/rpc.yaml
      - manifest/session.yaml
      - manifest/security.yaml
      - path: manifest/events.yaml
        select: { mandatory: true, capabilities: [] }
    vectors: [test-vectors/protobuf/vectors.yaml, test-vectors/tcp/byte-vectors.yaml]
    claimable_alone: false
    notes: "Includes SNTR-SESS-V1 and SNTR-RPC-V1 by reference, security cases, and only mandatory capability-free event cases; selection does not enable gated events. Transport coverage comes from at least one TRANSPORT_PROFILE below."

  - id: SNTR-SESS-V1
    kind: MANDATORY_CORE
    title: "Syntra Session v1 — connection-bound sessions, close/loss, expiry, no implicit resumption"
    required_for: "every conformance claim (runs over any claimed transport)"
    requirement_families: [SNTR-SESS, SNTR-AUTH, SNTR-HS, SNTR-RPL]
    manifests: [manifest/session.yaml]
    claimable_alone: false
    notes: "Resume-accept cases are Optional and gated on capability resume-v1 (no RFC exists; only resume-rejection is Mandatory in default v1)."

  - id: SNTR-RPC-V1
    kind: MANDATORY_CORE
    title: "Syntra RPC v1 — correlation, concurrency, deadlines, cancellation, typed errors, retry discipline"
    required_for: "every conformance claim"
    requirement_families: [SNTR-RPC, SNTR-ERR, SNTR-REL]
    manifests: [manifest/rpc.yaml]
    claimable_alone: false

  - id: SNTR-EVENTS-V1
    kind: OPTIONAL_CAPABILITY
    title: "Syntra Events v1 — optional subscriptions, delivery, ordering, replay, cursors"
    required_for: "only implementations claiming events-v1 and/or events-replay-v1 and/or syntra.update-recovery/1"
    requirement_families: [SNTR-EVENT, SNTR-CAP, SNTR-REL]
    manifests: [manifest/events.yaml, manifest/recovery.yaml]
    capabilities: [events-v1, events-replay-v1, syntra.update-recovery/1]
    claimable_alone: false
    notes: "Capability identifiers MUST NOT be advertised until their defining RFC is accepted; events identifiers follow the events spec and RFC 0006 is accepted for syntra.update-recovery/1. Recovery cases CONF-URP-001…017 are registered executable specifications with RFC 0006 accepted: requirements trace to the accepted SYN-URP-* family (SYN-URP-008/009 reserved, unassigned) and cases are registered, not yet executed. Runners load manifest/recovery.yaml subject to the syntra.update-recovery/1 capability gate; unclaimed recovery reports SKIP/UNSUPPORTED, never PASS."

  - id: SNTR-TCP-V1
    kind: TRANSPORT_PROFILE
    title: "Plaintext TCP framing (restricted development only)"
    required_for: "only TCP claims"
    requirement_families: [SNTR-TCP, SNTR-WIRE, SNTR-SER]
    manifests: [manifest/transport-tcp.yaml]
    vectors: [test-vectors/tcp/byte-vectors.yaml]
    secure: false
    production_allowed: false
    claim_label_suffix: "(restricted development only; not for public production traffic)"

  - id: SNTR-TLS-TCP-V1
    kind: TRANSPORT_PROFILE
    title: "TLS 1.3 over TCP"
    required_for: "only TLS/TCP claims"
    requirement_families: [SNTR-TLS, SNTR-TSEC, SNTR-TCP]
    manifests: [manifest/transport-tls.yaml]
    secure: true
    production_allowed: true

  - id: SNTR-HTTP-V1
    kind: TRANSPORT_PROFILE
    title: "HTTP/1.1 request/response RPC binding (restricted development only)"
    required_for: "only HTTP/1.1 claims"
    requirement_families: [SNTR-HTTP]
    manifests: [manifest/transport-http.yaml]
    vectors: [test-vectors/http/fixtures.yaml]
    secure: false
    production_allowed: false
    claim_label_suffix: "(restricted development only; not for public production traffic)"

  - id: SNTR-HTTPS-H1-V1
    kind: TRANSPORT_PROFILE
    title: "HTTPS using HTTP/1.1"
    required_for: "only HTTPS/H1 claims"
    requirement_families: [SNTR-HTTPS, SNTR-HTTP, SNTR-TSEC]
    manifests: [manifest/transport-https.yaml]
    vectors: [test-vectors/http/fixtures.yaml]
    secure: true
    production_allowed: true
    alpn: "http/1.1"

  - id: SNTR-HTTPS-H2-V1
    kind: TRANSPORT_PROFILE
    title: "HTTPS using HTTP/2"
    required_for: "only HTTPS/H2 claims"
    requirement_families: [SNTR-HTTPS, SNTR-HTTP, SNTR-TSEC]
    manifests: [manifest/transport-https.yaml]
    vectors: [test-vectors/http/fixtures.yaml]
    secure: true
    production_allowed: true
    alpn: "h2"

  - id: SNTR-WS-V1
    kind: TRANSPORT_PROFILE
    title: "WebSocket over HTTP/1.1 (restricted development only)"
    required_for: "only WS claims"
    requirement_families: [SNTR-WS]
    manifests: [manifest/transport-ws.yaml]
    vectors: [test-vectors/websocket/fixtures.yaml]
    secure: false
    production_allowed: false
    claim_label_suffix: "(restricted development only; not for public production traffic)"

  - id: SNTR-WSS-H1-V1
    kind: TRANSPORT_PROFILE
    title: "Secure WebSocket over HTTP/1.1 (TLS 1.3)"
    required_for: "only WSS claims"
    requirement_families: [SNTR-WSS, SNTR-WS, SNTR-TSEC]
    manifests: [manifest/transport-wss.yaml, manifest/transport-ws.yaml]
    vectors: [test-vectors/websocket/fixtures.yaml]
    secure: true
    production_allowed: true

  - id: SNTR-SC1-WSS-V1
    kind: TRANSPORT_PROFILE
    title: "Syntra Secure Channel v1 over verified TLS 1.3 WSS"
    required_for: "only SC1/WSS claims"
    requirement_families: [SNTR-SC, SNTR-DAUTH, SNTR-SCW, SNTR-TSEC]
    manifests: [manifest/sc1-wss.yaml]
    vectors: [test-vectors/sc1/context-vectors.yaml]
    secure: true
    production_allowed: true
    notes: "Canonical syntra.sc1.v1 context inside verified TLS 1.3 WSS at /syntra/v1/sc1/ws. Independent of the baseline WSS frame mapping. The initial permitted topology is direct TLS termination by the host; proxy termination is deferred. Registration is not an execution result."

claim_rules:
  - "Every claim MUST include SNTR-CORE-V1 (which includes SNTR-SESS-V1 and SNTR-RPC-V1) over at least one transport profile."
  - "No implementation is required to support every transport to claim Core conformance."
  - "A case declaring applicable_transports runs only over the listed transport families (SC1 multiplexes within ws_wss); a claim whose transports intersect none of them is valid with verdict SKIP for that case citing the key (conformance README §6)."
  - "Interop proof (SNTR-WIRE-901) requires the same logical Frame sequence over at least two transport profiles with only adapter changes."
  - "Production claims MUST name only secure transports (TLS-TCP, HTTPS-H1, HTTPS-H2, WSS-H1, SC1-WSS)."
  - "Capability claims REQUIRE the capability identifier plus its RFC reference; unallocated identifiers MUST NOT be claimed."
