[package]
name = "syntra-ffi"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
documentation.workspace = true
description = "Shared-runtime native production ABI 1 with isolated test-fixture mode; no default exports; WASM unsupported."

[lib]
name = "syntra_ffi"
crate-type = ["cdylib", "staticlib"]

[features]
default = []
# Test-only loopback ABI, NOT a production transport. Never enable in shipped
# binaries (including via --all-features). Default builds expose no C ABI.
test-fixture = ["dep:syntra-core", "dep:syntra-runtime", "dep:tokio"]
# Sole production ABI: shared Host/Initiator/recovery, native-only. Mutually
# exclusive with test-fixture (their intentionally separate C contracts differ).
production = ["dep:syntra-core", "dep:prost", "dep:syntra-runtime", "dep:tokio"]

[dependencies]
prost = { workspace = true, optional = true }

[target.'cfg(not(target_family = "wasm"))'.dependencies]
syntra-core = { path = "../syntra-core", version = "1.0.0-rc.5", optional = true }
syntra-runtime = { path = "../syntra-runtime", version = "1.0.0-rc.5", optional = true }
tokio = { version = "1", default-features = false, features = ["sync", "time", "rt-multi-thread", "macros"], optional = true }

[target.'cfg(not(target_family = "wasm"))'.dev-dependencies]
# Random test-library filenames; production connection IDs come from runtime.
getrandom = "0.3"
