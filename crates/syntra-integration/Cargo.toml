[package]
name = "syntra-integration"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish = false
description = "Syntra 1.0 container connectivity tests and loopback workload measurements; not published or a conformance verdict"

[features]
# Install the counting allocator only in the mixed_traffic diagnostic binary.
measure-heap = []
managed-media = ["syntra-net/media"]

[[bin]]
name = "peer"
path = "src/bin/peer.rs"

[dependencies]
syntra-core = { path = "../syntra-core", version = "1.0.0-rc.7" }
syntra-runtime = { path = "../syntra-runtime", version = "1.0.0-rc.7" }
# TCP and loopback WS fixtures; production graph needs no TLS implementation.
syntra-net = { path = "../syntra-net", version = "1.0.0-rc.7", default-features = false, features = ["tcp", "websocket"] }
tokio = { version = "1", features = ["full"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

[dev-dependencies]
tokio = { version = "1", features = ["full", "test-util"] }
futures-util = "0.3"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "tracing-log"] }
