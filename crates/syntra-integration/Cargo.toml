[package]
name = "syntra-integration"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish = false
description = "Docker-based SC1 TCP/WebSocket connectivity tests; not part of published libraries"

[[bin]]
name = "peer"
path = "src/bin/peer.rs"

[dependencies]
syntra-core = { path = "../syntra-core", version = "1.0.0-rc.1" }
syntra-runtime = { path = "../syntra-runtime", version = "1.0.0-rc.1" }
syntra-secure-channel = { path = "../syntra-secure-channel", version = "1.0.0-rc.1" }
syntra-sc1-transport = { path = "../syntra-sc1-transport", version = "1.0.0-rc.1", features = ["development-carriers"] }
syntra-ws = { path = "../syntra-ws", version = "1.0.0-rc.1" }
tokio = { version = "1", features = ["full"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

[dev-dependencies]
tokio = { version = "1", features = ["full", "test-util"] }
testcontainers = { version = "0.28" }
futures-util = "0.3"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "tracing-log"] }
