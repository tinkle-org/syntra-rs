[package]
name = "syntra-integration"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish = false
description = "Docker-based Syntra 1.0 TCP/WebSocket connectivity tests; not published or a conformance verdict"

[[bin]]
name = "peer"
path = "src/bin/peer.rs"

[dependencies]
syntra-core = { path = "../syntra-core", version = "1.0.0-rc.2" }
syntra-runtime = { path = "../syntra-runtime", version = "1.0.0-rc.2" }
# TCP and loopback WS fixtures; production graph needs no TLS implementation.
syntra-net = { path = "../syntra-net", version = "1.0.0-rc.2", default-features = false, features = ["tcp", "websocket"] }
tokio = { version = "1", features = ["full"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

[dev-dependencies]
tokio = { version = "1", features = ["full", "test-util"] }
testcontainers = { version = "0.28" }
futures-util = "0.3"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "tracing-log"] }
