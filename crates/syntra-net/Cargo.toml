[package]
name = "syntra-net"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish = false
description = "Syntra native networking, protected connections and managed client/server lifecycle"

[features]
default = []
tcp = ["tokio/io-util", "tokio/net"]
cross-carrier-candidate = ["tcp"]
http = ["tokio/io-util", "tokio/net", "dep:url", "dep:getrandom", "syntra-core/http-candidate"]
websocket = ["tokio/io-util", "tokio/net", "dep:url", "dep:tokio-tungstenite", "dep:httparse"]
tls-rustls = ["websocket", "dep:rustls", "dep:rustls-native-certs", "dep:tokio-rustls"]
reconnect = []
managed = ["tcp", "reconnect", "tokio/rt-multi-thread"]
proxy = ["tcp"]
# Explicit native host reference; never enabled implicitly by a carrier.
native-enrollment = ["dep:rusqlite", "dep:fs2", "dep:serde", "dep:serde_json", "dep:sha2"]

# All driver APIs use native Tokio scheduling and task ownership.
[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
syntra-core = { path = "../syntra-core", version = "1.0.0-rc.2" }
syntra-runtime = { path = "../syntra-runtime", version = "1.0.0-rc.2" }
tokio.workspace = true
tracing.workspace = true
thiserror.workspace = true
prost.workspace = true
zeroize = { version = "1", features = ["alloc"] }
futures-util.workspace = true
getrandom = { version = "0.3", optional = true }
url = { workspace = true, optional = true }
tokio-tungstenite = { version = "0.30", default-features = false, features = ["handshake"], optional = true }
httparse = { version = "=1.10.1", optional = true }
rustls = { version = "0.23", default-features = false, features = ["ring", "std"], optional = true }
rustls-native-certs = { version = "0.8", optional = true }
tokio-rustls = { version = "0.26", default-features = false, features = ["ring"], optional = true }

rusqlite = { version = "=0.37.0", features = ["bundled"], optional = true }
fs2 = { version = "=0.4.3", optional = true }
serde = { version = "=1.0.229", features = ["derive"], optional = true }
serde_json = { version = "=1.0.154", optional = true }
sha2 = { version = "=0.11.1", optional = true }

[target.'cfg(not(target_arch = "wasm32"))'.dev-dependencies]
tokio = { version = "1", features = ["full", "test-util"] }
criterion = { version = "0.5", features = ["async_tokio"] }
futures-util = "0.3"
# Locally generated test certificates only.
rcgen = { version = "=0.14.10", default-features = false, features = ["crypto", "ring"] }
# TLS 1.2 exists only to construct deliberately incompatible test peers.
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12"] }
tokio-rustls = { version = "0.26", default-features = false, features = ["ring", "tls12"] }
tokio-tungstenite = { version = "0.30", default-features = false, features = ["connect", "__rustls-tls"] }

[[bench]]
name = "pipe"
harness = false
required-features = ["tcp"]

[[example]]
name = "managed_tcp"
required-features = ["managed"]

[[example]]
name = "managed_wss"
required-features = ["managed", "websocket"]

[[example]]
name = "managed_http"
required-features = ["managed", "http"]
