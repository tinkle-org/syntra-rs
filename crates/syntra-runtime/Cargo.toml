[package]
name = "syntra-runtime"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
documentation.workspace = true
description = "Syntra v1 connection runtime: initiator + host engines and connection-bound session manager over transport-agnostic byte channels. No Tinkle types."

[dependencies]
syntra-core = { path = "../syntra-core", version = "1.0.0-rc.1" }
prost.workspace = true
bytes.workspace = true
thiserror.workspace = true
tracing.workspace = true
tokio.workspace = true
futures-util.workspace = true
subtle = "2.6"
sha2 = "0.10"
web-time = "1"

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
getrandom = "0.3"

[target.'cfg(target_arch = "wasm32")'.dependencies]
getrandom = { version = "0.2", features = ["js"] }
wasm-bindgen = "0.2"
wasm-bindgen-futures = "0.4"
js-sys = "0.3"

[dev-dependencies]
syntra-core = { path = "../syntra-core", version = "1.0.0-rc.1" }
prost.workspace = true
tokio.workspace = true
