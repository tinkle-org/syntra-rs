[package]
name = "syntra-secure-channel"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
description = "Networking-independent local SC1 Noise channel"

[dependencies]
snow = { version = "=0.10.0", default-features = false, features = ["std", "default-resolver", "use-getrandom", "use-curve25519", "use-chacha20poly1305", "use-sha2"] }
zeroize = { version = "1", features = ["alloc"] }
getrandom = "0.3"
thiserror.workspace = true

[dev-dependencies]
criterion = { version = "0.5", features = ["async_tokio"] }

[[bench]]
name = "channel"
harness = false
