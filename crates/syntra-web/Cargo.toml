[package]
name = "syntra-web"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
documentation.workspace = true
description = "Browser client for Syntra v1 (connect/call/notify/close JS-facing API over syntra-ws)."

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
syntra-core = { path = "../syntra-core", version = "1.0.0-rc.2" }
syntra-runtime = { path = "../syntra-runtime", version = "1.0.0-rc.2" }
syntra-ws = { path = "../syntra-ws", version = "1.0.0-rc.2" }
tokio.workspace = true
wasm-bindgen = "0.2"
wasm-bindgen-futures = "0.4"
js-sys = "0.3"
tracing = "0.1"

[dev-dependencies]
tokio.workspace = true
