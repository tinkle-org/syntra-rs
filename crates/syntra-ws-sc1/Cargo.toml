[package]
name = "syntra-ws-sc1"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
# Local-only SC1 draft binding over native WebSocket. Not an accepted upstream
# profile and not independently audited: stays unpublished so the five
# publishable crates (core, runtime, ws, web, ffi) keep a publishable
# dependency closure for the `cargo package` gate.
publish = false
description = "Native WebSocket SC1 local-revision binding (local-only draft, not published)"

[dependencies]
syntra-secure-channel = { path = "../syntra-secure-channel", version = "1.0.0-rc.1" }
syntra-core = { path = "../syntra-core", version = "1.0.0-rc.1" }
syntra-runtime = { path = "../syntra-runtime", version = "1.0.0-rc.1" }
syntra-tcp = { path = "../syntra-tcp", version = "1.0.0-rc.1", default-features = false }
prost.workspace = true
bytes.workspace = true
thiserror.workspace = true
futures-util.workspace = true
url.workspace = true
tracing.workspace = true
tokio = { version = "1", features = ["full"] }
tungstenite = "0.26"
tokio-tungstenite = { version = "0.26", features = ["rustls-tls-native-roots"] }
rustls = { version = "0.23", default-features = false, features = ["ring", "std"] }
rustls-native-certs = "0.8"

[dev-dependencies]
tokio = { version = "1", features = ["full"] }
tokio-tungstenite = { version = "0.26", features = ["rustls-tls-native-roots"] }
futures-util = "0.3"
