[package]
name = "syntra-ws"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
documentation.workspace = true
description = "Syntra WSS/WS transport adapters (native tokio + browser wasm). Binary-only, one message per Frame."

[dependencies]
syntra-core = { path = "../syntra-core", version = "1.0.0-rc.1" }
syntra-runtime = { path = "../syntra-runtime", version = "1.0.0-rc.1" }
prost.workspace = true
bytes.workspace = true
thiserror.workspace = true
futures-util.workspace = true
url.workspace = true
tracing.workspace = true

# Native-only WS stack: tokio + tungstenite. Gated to not(wasm32) because
# mio/net break wasm32-unknown-unknown.
[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
tokio = { version = "1", features = ["full"] }
tungstenite = "0.30"
tokio-tungstenite = { version = "0.26", features = ["rustls-tls-native-roots"] }
rustls = { version = "0.23", default-features = false, features = ["ring", "std"] }
rustls-native-certs = "0.8"

# WASM browser stack: reduced tokio (no mio/net) + ws_stream_wasm.
[target.'cfg(target_arch = "wasm32")'.dependencies]
tokio = { version = "1", default-features = false, features = ["sync", "time", "rt", "macros"] }
ws_stream_wasm = "0.7"
wasm-bindgen-futures = "0.4"
wasm-bindgen = "0.2"
js-sys = "0.3"

[dev-dependencies]
tokio = { version = "1", features = ["full"] }
tokio-tungstenite = { version = "0.26", features = ["rustls-tls-native-roots"] }
syntra-core = { path = "../syntra-core", version = "1.0.0-rc.1" }
syntra-runtime = { path = "../syntra-runtime", version = "1.0.0-rc.1" }
futures-util = "0.3"
