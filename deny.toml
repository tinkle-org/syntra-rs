[graph]
targets = [{ triple = "x86_64-unknown-linux-gnu" }, { triple = "wasm32-unknown-unknown" }]
all-features = false
no-default-features = false

[advisories]
version = 2
db-path = "~/.cargo/advisory-dbs"
db-urls = ["https://github.com/rustsec/advisory-db"]
ignore = []
# Unmaintained warnings are reviewed explicitly; do not blanket-ignore.
# yq-eval-style exceptions MUST cite a reviewed issue/PR and expiry date.

[licenses]
version = 2
# Apache-2.0 Syntra crates: only permissive licenses are allowed.
# Anything not listed (including GPL/AGPL/LGPL copyleft) fails the check.
# Unlicense (public-domain dedication, OSI-approved) is allowed.
allow = [
  "Apache-2.0",
  "MIT",
  "BSD-2-Clause",
  "BSD-3-Clause",
  "ISC",
  "Unicode-3.0",
  "Unlicense",
]
confidence-threshold = 0.8
# Reviewed upstream foldhash 0.1.5 LICENSE: permissive Zlib terms require
# preserving the notice and marking altered sources; no copyleft obligations.
# rusqlite 0.37.0 -> hashlink 0.10.0 -> hashbrown 0.15.5 uses this package.
# Limit approval to this exact package/version, not all future Zlib dependencies.
exceptions = [{ crate = "foldhash@0.1.5", allow = ["Zlib"] }]

[licenses.private]
ignore = false

[bans]
multiple-versions = "allow"
wildcards = "allow"
highlight = "all"
workspace-default-features = "allow"
external-default-features = "allow"
allow = []
deny = []
# Duplicate dependencies are explicitly allowed: arbitrary bans would
# unnecessarily break portability across native/WASM feature combinations.
skip = []
skip-tree = []

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
allow-git = []
