# release-plz configuration for the five-crate syntra-rs workspace.
#
# The crates share `workspace.package.version` and are tagged per-crate as
# `syntra-<crate>-vX.Y.Z`, which matches release-plz's default
# `{{ package }}-v{{ version }}` tag pattern. Publishing uses each crate's
# default features only: `syntra-ffi` defaults to no ABI, so `cargo publish`
# never enables the `production` or `test-fixture` features and never passes
# `--all-features`. Dependency order is resolved topologically
# (`core -> runtime -> ws/web -> ffi`).
[workspace]
# Only publish when the Release PR merges, never on every push to main.
release_always = false
# Mark `1.0.0-rc.x` releases as pre-releases on GitHub automatically.
git_release_type = "auto"
git_release_enable = true
git_tag_enable = true
changelog_update = true
semver_check = true
publish = true
publish_allow_dirty = false
publish_no_verify = false
publish_all_features = false
publish_timeout = "10m"
pr_labels = ["release"]
pr_branch_prefix = "release-plz-"
dependencies_update = false
